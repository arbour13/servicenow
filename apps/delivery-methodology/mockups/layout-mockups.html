  function renderStrip(){
    const p = phases()[pi];
    document.getElementById('striplabel').textContent = p.name + ' — sub-phases';
    document.getElementById('film').innerHTML = p.subs.map((s,i)=>{
      if (s.detailed && si===null) { si = i; }
      const on = si===i;
      let inner = '<div class="fsid">'+esc(s.sid)+'</div><div class="fnm">'+esc(s.name)+'</div>';
      if (!s.detailed) { inner += '<div class="fmeta">Not yet written</div>'; }
      else if (s.recent) { inner += '<div class="rbadge"><span class="d"></span>Recently changed</div>'; }
      else { inner += '<div class="fmeta">'+s.tasks.length+' tasks</div>'; }
      return '<div class="fcard '+(on?'on':'')+' '+(s.detailed?'':'stub')+'" style="--c:'+p.color+'" data-s="'+i+'">'+inner+'</div>';
    }).join('');
    document.querySelectorAll('.fcard').forEach(el=>el.onclick=()=>{ si=+el.dataset.s; renderStrip(); renderPanel(); });
  }
  function derivedWho(s){
    const ids=[]; s.tasks.forEach(t=>Object.keys(t.raci).forEach(id=>{ if(!ids.includes(id)) ids.push(id); })); return ids;
  }
  function renderPanel(){
    const p = phases()[pi];
    const s = si!==null ? p.subs[si] : null;
    const host = document.getElementById('panelHost');
    if (!s || !s.detailed) {
      host.innerHTML = '<div class="panel" style="--c:'+p.color+'"><div class="pcrumb">'+esc(p.name)+' › '+esc(s?s.sid:'')+'</div><h2 class="ptitle">'+esc(s?s.name:'')+'</h2><p class="obj" style="color:#7d97a8">This sub-phase hasn’t been written yet.</p></div>';
      return;
    }
    let h = '<div class="panel" style="--c:'+p.color+'">';
    h += '<div class="pcrumb">'+esc(p.name)+' › '+esc(s.sid)+'</div>';
    h += '<h2 class="ptitle">'+esc(s.name)+(s.recent?'<span class="prec"><span class="d"></span>Recently changed</span>':'')+'</h2>';
    if (s.recent && s.changeSummary) { h += '<div class="pchange"><b>What changed:</b>&nbsp;'+esc(s.changeSummary)+'</div>'; }
    h += '<p class="lede">'+esc(s.overview)+'</p>';
    h += '<h4 class="sec">Objective</h4><p class="obj">'+esc(s.objective)+'</p>';
    h += '<div class="metastrip"><div class="mi"><span class="mk">Level of Effort</span>'+esc(s.loe)+'</div>';
    h += '<div class="mi"><span class="mk">Participants</span><div class="who">'+derivedWho(s).map(id=>'<span>'+esc(JT[id].abbr)+'</span>').join('')+'</div></div>';
    if (s.sched) { h += '<div class="mi"><span class="mk">Scheduling</span>'+esc(s.sched)+'</div>'; }
    h += '</div>';
    h += '<div class="sechead"><h4 class="sec" style="margin:0">Tasks</h4><button class="raci-link" id="openRaci">Open in RACI grid →</button></div>';
    h += '<div class="tasklist">'+s.tasks.map(t=>{
      const chips = Object.keys(t.raci).map(id=>{
        const lt = t.raci[id].map(l=>'<span style="color:'+RACI_COLORS[l]+'">'+l+'</span>').join('');
        return '<span class="rchip"><span class="ab">'+esc(JT[id].abbr)+'</span><span class="lt">'+lt+'</span></span>';
      }).join('');
      return '<div class="task"><div class="tt">'+esc(t.text)+'</div><div class="rchips">'+chips+'</div></div>';
    }).join('')+'</div>';
    h += '<div class="twocol"><div><h4 class="sec">Inputs</h4><ul class="idlist">'+s.inputs.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>';
    h += '<div><h4 class="sec">Deliverables</h4><ul class="idlist">'+s.deliverables.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul></div></div>';
    h += '</div>';
    host.innerHTML = h;
    const btn = document.getElementById('openRaci');
    if (btn) { btn.onclick = ()=>{ if (window.parent && window.parent.goConceptD) { window.parent.goConceptD(mk, s.sid); } }; }
  }
  function renderAll(){ renderSwitch(); renderRoad(); renderStrip(); renderPanel(); }
  renderAll();
  <\/script></body></html>`;
}

/* ============================================================
   CONCEPT D — RACI grid (dedicated responsibility view)

function conceptD() {

  const dataJson = JSON.stringify({ METH, JT, RACI_NAMES, RACI_COLORS, target });
  return `<!DOCTYPE html><html><head><meta charset="UTF-8">

  <style>

  .pfilters { display:flex; gap:7px; flex-wrap:wrap; }
  .pchip { font-family:inherit; font-size:12px; font-weight:600; padding:5px 12px; border-radius:15px; border:1px solid transparent; cursor:pointer; }
  .legend { display:flex; gap:14px; margin-left:auto; align-items:center; }

  .focusbar { display:none; align-items:center; gap:10px; background:rgba(63,224,197,.08); border:1px solid rgba(63,224,197,.3); border-radius:8px; padding:8px 14px; margin-bottom:14px; font-size:13px; }
  .focusbar.show { display:flex; }
  .focusbar b { color:#3fe0c5; }
  .focusbar button { margin-left:auto; font-family:inherit; font-size:12px; font-weight:600; color:#9fd; background:#123a52; border:1px solid #1f3f5c; border-radius:14px; padding:4px 12px; cursor:pointer; }
  .scroller { overflow-x:auto; border:1px solid #1a3550; border-radius:12px; }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
  thead th { position:sticky; top:0; background:#0c2338; z-index:3; padding:11px 8px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:#7fd8cb; border-bottom:2px solid #1f3f5c; cursor:pointer; user-select:none; white-space:nowrap; transition:background .12s; }
  thead th:hover { background:#123a52; color:#fff; }
  thead th.taskcol { position:sticky; left:0; z-index:4; text-align:left; width:320px; min-width:320px; cursor:default; background:#0c2338; }
  thead th.focused { background:#17b8a6; color:#04231f; }
  thead th .cnt { display:block; font-size:9px; color:#5f9; font-weight:400; margin-top:2px; }
  thead th.focused .cnt { color:#04231f; }
  .grouprow td { background:#0d2338; font-weight:700; padding:9px 12px; font-size:12.5px; border-top:1px solid #1f3f5c; border-bottom:1px solid #1f3f5c; position:sticky; left:0; }
  .grouprow .gsid { font-family:'IBM Plex Mono',monospace; color:#04231f; padding:2px 9px; border-radius:10px; margin-right:9px; font-size:11px; }
  tbody tr.taskrow { cursor:pointer; }
  tbody tr.taskrow:hover td { background:#0e2947; }
  tbody td { padding:10px 8px; border-bottom:1px solid #142c44; vertical-align:middle; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; }
  tbody td.tname { position:sticky; left:0; background:#0a1e33; z-index:1; text-align:left; font-family:'Montserrat',sans-serif; font-weight:500; font-size:13px; line-height:1.4; width:320px; min-width:320px; }
  tbody tr.taskrow:hover td.tname { background:#0e2947; }
  td.colhi, th.colhi { background:#10314e !important; }
  td.dimmed { opacity:.25; }
  .lt { letter-spacing:1px; }
  .dash { color:#294863; }
  .exrow { display:none; }
  .exrow.show { display:table-row; }
  .exrow td { background:#0c2740; text-align:left; font-family:'Montserrat',sans-serif; font-weight:400; padding:14px 18px; border-bottom:2px solid #1f3f5c; position:sticky; left:0; }
  .exgrid { display:flex; gap:34px; flex-wrap:wrap; }
  .exgrid > div { flex:1; min-width:220px; }
  .exgrid h5 { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#3fe0c5; margin:0 0 6px; }
  .exgrid p { margin:0; color:#c3d5dd; font-size:13px; line-height:1.6; }
  .exraci { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .exraci span { font-family:'IBM Plex Mono',monospace; font-size:11px; background:#0e2947; border:1px solid #1f3f5c; border-radius:6px; padding:3px 8px; }
  tr.flash td { animation:flash 1.6s ease; }
  @keyframes flash { 0%,40% { background:#123a52; } 100% { background:transparent; } }
  .totalrow td { background:#0c2338; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7fd8cb; border-top:2px solid #1f3f5c; padding:9px 8px; text-align:center; position:sticky; bottom:0; }
  .totalrow td.tname { text-align:left; font-weight:600; position:sticky; left:0; background:#0c2338; z-index:1; }
  </style></head><body><div class="wrap">
    <div class="topline">
      <div><h1>Who does what</h1><p class="sub">Every task and every job title on one grid. Click a job-title column to focus on just their responsibilities; click a task row for its full context.</p></div>
      <div class="mswitch" id="mswitch"></div>
    </div>
    <div class="controls">
      <div class="pfilters" id="pfilters"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="focusbar" id="focusbar"></div>
    <div class="scroller"><table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table></div>
  </div>
  <script>
  const { METH, JT, RACI_NAMES, RACI_COLORS, target } = ${dataJson};
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  let mk = (target && target.methKey) ? target.methKey : 'project';
  let activePhases = new Set();
  let focusJob = null;
  let rowSeq = 0;

  function phases(){ return METH[mk].phases; }
  function jtIds(){
    const ids=[]; phases().forEach(p=>p.subs.forEach(s=>{ if(s.detailed) s.tasks.forEach(t=>Object.keys(t.raci).forEach(id=>{ if(!ids.includes(id)) ids.push(id); })); }));
    return ids;
  }
  function resetPhases(){ activePhases = new Set(phases().map(p=>p.name)); }

  function renderSwitch(){
    document.getElementById('mswitch').innerHTML = Object.keys(METH).map(k=>'<button class="'+(k===mk?'on':'')+'" data-m="'+k+'">'+esc(METH[k].name)+'</button>').join('');
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ mk=b.dataset.m; focusJob=null; resetPhases(); renderAll(); });
  }
  function renderLegend(){
    document.getElementById('legend').innerHTML = ['R','A','C','I'].map(l=>'<span class="lg"><span class="sw" style="background:'+RACI_COLORS[l]+'">'+l+'</span>'+RACI_NAMES[l]+'</span>').join('');
  }
  function renderFilters(){
    document.getElementById('pfilters').innerHTML = phases().map(p=>{
      const on = activePhases.has(p.name);
      return '<button class="pchip" data-p="'+esc(p.name)+'" style="background:'+(on?p.color:'#0e2947')+';color:'+(on?'#04231f':'#8fa8b8')+';border-color:'+(on?'transparent':'#1f3f5c')+'">'+esc(p.name)+'</button>';
    }).join('');
    document.querySelectorAll('.pchip').forEach(el=>el.onclick=()=>{
      const nm = el.dataset.p;
      if (activePhases.has(nm)) { activePhases.delete(nm); } else { activePhases.add(nm); }
      renderFilters(); renderTable();
    });
  }
  function letterCounts(){
    const c = {}; jtIds().forEach(id=>c[id]=0);
    phases().filter(p=>activePhases.has(p.name)).forEach(p=>p.subs.forEach(s=>{ if(s.detailed) s.tasks.forEach(t=>Object.keys(t.raci).forEach(id=>{ c[id]=(c[id]||0)+t.raci[id].length; })); }));
    return c;
  }
  function renderHead(){
    const counts = letterCounts();
    const ids = jtIds();
    let h = '<th class="taskcol">Task</th>' + ids.map(id=>{
      const foc = focusJob===id ? ' focused' : '';
      return '<th class="jt'+foc+'" data-col="'+id+'">'+esc(JT[id].abbr)+'<span class="cnt">'+(counts[id]||0)+'</span></th>';
    }).join('');
    document.getElementById('thead').innerHTML = h;
    document.querySelectorAll('th.jt').forEach(th=>{
      th.onmouseenter = ()=>highlightCol(th.dataset.col, true);
      th.onmouseleave = ()=>highlightCol(th.dataset.col, false);
      th.onclick = ()=>{ focusJob = (focusJob===th.dataset.col)?null:th.dataset.col; renderAll(); };
    });
  }
  function highlightCol(id, on){
    if (focusJob) return;
    const ids = jtIds(); const idx = ids.indexOf(id);
    document.querySelectorAll('[data-cellcol="'+id+'"]').forEach(td=>td.classList.toggle('colhi', on));
    const th = document.querySelector('th[data-col="'+id+'"]'); if (th) th.classList.toggle('colhi', on);
  }
  function renderTable(){
    const ids = jtIds();
    let html=''; rowSeq=0;
    phases().filter(p=>activePhases.has(p.name)).forEach(p=>{
      p.subs.filter(s=>s.detailed).forEach(s=>{
        const rows = focusJob ? s.tasks.filter(t=>t.raci[focusJob]) : s.tasks;
        if (!rows.length) return;
        html += '<tr class="grouprow" data-sid="'+esc(s.sid)+'"><td colspan="'+(ids.length+1)+'"><span class="gsid" style="background:'+p.color+'">'+esc(s.sid)+'</span>'+esc(p.name)+' — '+esc(s.name)+'</td></tr>';
        rows.forEach(t=>{
          const rid = 'ex'+(rowSeq++);
          let cells = ids.map(id=>{
            const dim = focusJob && id!==focusJob ? ' dimmed' : '';
            if (!t.raci[id]) return '<td class="cell'+dim+'" data-cellcol="'+id+'"><span class="dash">–</span></td>';
            const lt = t.raci[id].map(l=>'<span style="color:'+RACI_COLORS[l]+'">'+l+'</span>').join('');
            return '<td class="cell'+dim+'" data-cellcol="'+id+'"><span class="lt">'+lt+'</span></td>';
          }).join('');
          html += '<tr class="taskrow" data-ex="'+rid+'"><td class="tname">'+esc(t.text)+'</td>'+cells+'</tr>';
          const exraci = Object.keys(t.raci).map(id=>'<span><b>'+esc(JT[id].abbr)+'</b> '+t.raci[id].map(l=>RACI_NAMES[l]).join(', ')+'</span>').join('');
          html += '<tr class="exrow" id="'+rid+'"><td colspan="'+(ids.length+1)+'"><div class="exgrid"><div><h5>Phase context</h5><p>'+esc(s.overview)+'</p></div><div><h5>This task — full RACI</h5><div class="exraci">'+exraci+'</div></div></div></td></tr>';
        });
      });
    });
    if (!html) { html = '<tr><td class="tname" colspan="'+(ids.length+1)+'" style="padding:26px;color:#5f7d92">No tasks match the current filters.</td></tr>'; }
    document.getElementById('tbody').innerHTML = html;
    document.querySelectorAll('.taskrow').forEach(tr=>tr.onclick=()=>{
      const ex = document.getElementById(tr.dataset.ex);
      const open = ex.classList.contains('show');
      document.querySelectorAll('.exrow.show').forEach(e=>e.classList.remove('show'));
      if (!open) ex.classList.add('show');
    });
  }
  function renderFoot(){
    const ids = jtIds(); const counts = letterCounts();
    document.getElementById('tfoot').innerHTML = '<tr class="totalrow"><td class="tname">Total involvements</td>'+ids.map(id=>'<td>'+(counts[id]||0)+'</td>').join('')+'</tr>';
  }
  function renderFocusBar(){
    const fb = document.getElementById('focusbar');
    if (!focusJob) { fb.classList.remove('show'); fb.innerHTML=''; return; }
    fb.classList.add('show');
    fb.innerHTML = 'Focused on <b>&nbsp;'+esc(JT[focusJob].name)+'</b>&nbsp;— showing only tasks where they carry a RACI designation.<button id="clearFocus">Clear focus</button>';
    document.getElementById('clearFocus').onclick = ()=>{ focusJob=null; renderAll(); };
  }
  function renderAll(){ renderSwitch(); renderLegend(); renderFilters(); renderHead(); renderFocusBar(); renderTable(); renderFoot(); }
  resetPhases();
  renderAll();
  if (target && target.sid) {
    const gr = document.querySelector('.grouprow[data-sid="'+target.sid+'"]');
    if (gr) {
      gr.scrollIntoView({ block:'center' });
      gr.classList.add('flash');
      let n = gr.nextElementSibling;
      while (n && !n.classList.contains('grouprow')) { n.classList.add('flash'); n = n.nextElementSibling; }
    }
  }
  <\/script></body></html>`;
}

/* ---------------- Gallery wiring ---------------- */
const CONCEPTS = [
  { key: 'a', label: 'A · Journey', desc: 'Primary navigation. Project / GRS switch, a progress-filled roadmap with recent-change markers, and a full read-through per sub-phase — with a handoff into the RACI grid.', fn: conceptA },
  { key: 'd', label: 'D · RACI grid', desc: 'The responsibility view. Click a job-title column to focus on one person’s tasks; totals show workload; a task row expands to full context. Deep-links from the Journey.', fn: conceptD }
];

const tabsEl = document.getElementById('tabs');
const descEl = document.getElementById('desc');
const stage = document.getElementById('stage');

function selectConcept(key) {
  const c = CONCEPTS.find(x => x.key === key);
  tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  descEl.textContent = c.desc;
  stage.srcdoc = c.fn();
}
window.selectConcept = selectConcept;

tabsEl.innerHTML = CONCEPTS.map(c => `<button data-key="${c.key}">${c.label}</button>`).join('');
tabsEl.querySelectorAll('button').forEach(b => b.onclick = () => selectConcept(b.dataset.key));
selectConcept('a');
</script>
