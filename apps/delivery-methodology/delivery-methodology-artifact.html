    --hs-navy-0: #0a2136;    /* $brand-secondary */
    --hs-navy-1: #0a2136;    /* $brand-secondary (page/chrome share one base, per real theme) */
    --hs-navy-2: #0b2d45;    /* $brand-secondary-light */
    --hs-navy-3: #013c56;    /* $brand-secondary-lightest */
    --hs-line: rgba(197, 220, 231, 0.35);   /* $border-tertiary, dimmed for use as a hairline on dark surfaces */
    --hs-line-soft: rgba(197, 220, 231, 0.18);
    --hs-border-tertiary: #c5dce7;  /* $border-tertiary at full strength - real toggle-button border color */
    --hs-teal: #00e0ac;      /* $brand-primary */
    --hs-mint: #00e0ac;      /* alias - real theme uses one accent, not two */
    --hs-teal-deep: #007a5e; /* $brand-primary-light */
    --ink: #ffffff;          /* $text-white */
    --ink-soft: #c5dce7;     /* $border-tertiary, used as secondary text on navy */
    --ink-2: var(--ink-soft); /* alias - was referenced but never defined; same secondary-text role as ink-soft */
    --ink-faint: #7d97a8;
    --text-on-primary: #0a2136; /* $text-primary - dark text used on top of bright gradient buttons */

    --paper: var(--hs-navy-1);
    --surface: linear-gradient(160deg, var(--hs-navy-2) 0%, var(--hs-navy-0) 100%);
    --surface-flat: var(--hs-navy-2);
    --surface-2: var(--hs-navy-3);
    --line: var(--hs-line);
    --line-soft: var(--hs-line-soft);
    --navy: var(--hs-navy-1);
    --navy-2: var(--hs-navy-2);
    --navy-line: var(--hs-line);
    --teal: var(--hs-teal);
    --teal-deep: var(--hs-teal-deep);
    --teal-wash: rgba(0, 224, 172, 0.12);

    /* primary button system - $gradient-light-5 / -7, $gradient-dark-9, from btn-dark / btn-dark-toggle mixins */
    --gradient-pill: linear-gradient(90deg, #21fbc8 0%, #3ec2f8 100%);
    --gradient-pill-hover: linear-gradient(90deg, #a7ffeb 0%, #49c6fa 100%);
    --gradient-selected: linear-gradient(90deg, #1e737e 0%, #055c7c 100%);
    --gradient-card: linear-gradient(135deg, #275b63 0%, #0d435f 100%);    /* $gradient-dark-10 */
    --gradient-card-2: linear-gradient(135deg, #327374 0%, #0c506e 100%);  /* $gradient-dark-11 */
    --shadow-inset: 0px 4px 4px 0px rgba(0, 28, 54, 0.20) inset;
    --shadow-md: 0 4px 4px 0 rgba(0, 0, 0, 0.25);
    --shadow-sm: 2px 2px 4px 0 rgba(0, 0, 0, 0.15);

    /* phase progression - theme brand/tertiary "light" family only (the darker steps of each
       family fail contrast on this dark UI, which is what caused Close to wash out); every
       step below clears WCAG 1.4.11 (>=3:1) against both the card gradient and the roadmap track */
    --p1: #00e0ac;  /* $brand-primary */
    --p2: #21fbc8;  /* $brand-primary-lighter */
    --p3: #8ef1ff;  /* $brand-tertiary-4 */
    --p4: #3ec2f8;  /* $brand-info */
    --p5: #b1f5ff;  /* $brand-tertiary-light */

    /* RACI - theme semantic tokens, not invented hex: R=success, A=warning, C=info, I=a light neutral.
       (there's no "standard" RACI color convention; this just stops re-inventing what the theme already has) */
    --r-r: #01cc52;  /* $brand-success - Responsible */
    --r-a: #e5c20b;  /* $brand-warning - Accountable */
    --r-c: #3ec2f8;  /* $brand-info - Consulted */
    --r-i: #bdc2cb;  /* $color-light - Informed */

    --radius: 8px;        /* $border-radius-large */
    --radius-sm: 4px;     /* $border-radius-base */
    --radius-round: 50px; /* $border-radius-round */
    --shadow: var(--shadow-sm);
    --rail-w: 320px;
    --font-display: 'Montserrat', 'Lato', sans-serif;
    --font-body: 'Montserrat', 'Lato', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    /* focus ring - $focus-ring-primary (2px solid $brand-primary) + $focus-ring-offset-medium, from the
       theme's focus-visible mixin. Replaces the missing focus indicators (WCAG 2.4.7) app-wide. */
    --focus-ring: 2px solid var(--hs-teal);
    --focus-ring-offset: 2px;
  }
  :focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-ring-offset); }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; cursor: pointer; }

  ::selection { background: var(--teal); color: var(--text-on-primary); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  .body { flex: 1; min-height: 0; }

  /* ---------- Page (content column - the portal supplies the header/nav above this) ---------- */
  .page { max-width: 1120px; margin: 0 auto; padding: 28px 40px 100px; }
  .main { }

  /* ---------- Page header (relocated from an app top-bar into the page itself) ---------- */
  .pagehdr { margin-bottom: 22px; }
  .pagehdr-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }

  /* view tabs - segmented toggle */
  .views { display: inline-flex; gap: 2px; background: var(--surface-flat); border-radius: 10px; padding: 3px; }
  .vtab { display: inline-flex; align-items: center; gap: 7px; border: none; background: none; color: var(--ink-2); font-family: var(--font-body); font-weight: 600; font-size: 13px; padding: 7px 15px; border-radius: 7px; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .vtab:hover { color: #fff; }
  .vtab svg { width: 15px; height: 15px; }
  .vtab.on { background: var(--surface-2); color: #fff; }
  .vtab.on svg { stroke: var(--teal); }

  /* controls row below the title: methodology switch (Project/GRS) */
  .pagehdr-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
  .hsearch { position: relative; }
  .hsearch input { height: 34px; width: 200px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-flat); color: #fff; padding: 0 14px 0 34px; font-family: inherit; font-size: 13px; outline: none; }
  .hsearch input::placeholder { color: var(--ink-faint); }
  .hsearch input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0,224,172,0.2); }
  .hsearch svg { position: absolute; left: 12px; top: 10px; width: 15px; height: 15px; stroke: var(--ink-faint); fill: none; stroke-width: 2; }
  .jargon-toggle { color: var(--ink-2); }

  .pagehdr-title { margin-bottom: 14px; }
  .pagehdr-title-row { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; margin-bottom: 5px; }
  .pagehdr-title-row .pg-h1 { margin-bottom: 0; }
  .pg-h1 { font-family: var(--font-display); font-weight: 800; font-size: 27px; letter-spacing: -0.015em; margin: 0 0 5px; color: #fff; }
  .pg-sub { margin: 0; color: var(--ink-soft); font-size: 13.5px; max-width: 66ch; line-height: 1.5; }

  /* ---------- Main ---------- */

  /* Methodology switch (just below the title, on Journey / RACI) */
  .meth-switch { display: inline-flex; gap: 4px; background: var(--navy-2); padding: 4px; border-radius: 24px; border: 1px solid var(--line); flex-shrink: 0; }
  .meth-tab {
    border: none; background: transparent; color: #a9c1d6;
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    padding: 8px 22px; border-radius: 20px; cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .meth-tab:hover { color: #fff; }
  .meth-tab.active { background: var(--gradient-pill); color: var(--text-on-primary); box-shadow: var(--shadow-inset); }

  /* View intro (RACI / What's New / Search headers) */
  .view-intro { margin-bottom: 22px; }
  .view-intro h1 { font-family: var(--font-display); font-weight: 800; font-size: 27px; letter-spacing: -0.015em; margin: 0 0 5px; color: #fff; }
  .view-intro p { margin: 0; color: var(--ink-soft); font-size: 13.5px; max-width: 66ch; line-height: 1.5; }

  /* ---------- Journey roadmap ---------- */
  .jrny-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
  .jrny-head h1 { font-family: var(--font-display); font-weight: 800; font-size: 27px; letter-spacing: -0.015em; margin: 0 0 4px; color: #fff; }
  .jrny-head p { margin: 0; color: var(--ink-soft); font-size: 13.5px; }

  /* Connected journey track - phases as nodes on a progressing line */
  .road { position: relative; display: grid; grid-template-columns: repeat(var(--stations, 5), 1fr); margin-bottom: 30px; padding-top: 4px; }
  .road::before { content: ''; position: absolute; left: calc(50% / var(--stations)); right: calc(50% / var(--stations)); top: 26px; height: 3px; border-radius: 3px; background: var(--surface-flat); }
  .road::after { content: ''; position: absolute; left: calc(50% / var(--stations)); top: 26px; height: 3px; border-radius: 3px; width: calc(100% * var(--active) / var(--stations)); background: linear-gradient(90deg, var(--p1), var(--p3)); transition: width .3s ease; }
  .station { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; background: none; border: none; font-family: inherit; padding: 0 6px; }
  .station .n { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; background: var(--surface-2); border: 2px solid var(--nc); position: relative; z-index: 1; transition: transform .18s, box-shadow .18s, background .18s; }
  .station.done .n { background: color-mix(in srgb, var(--nc) 26%, var(--surface-2)); }
  .station.on .n { background: var(--nc); color: #06121c; transform: scale(1.12); box-shadow: 0 0 0 5px color-mix(in srgb, var(--nc) 22%, transparent); }
  .station:hover .n { transform: scale(1.07); }
  .station.on:hover .n { transform: scale(1.12); }
  .station .n .udot { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--hs-teal); border: 2px solid var(--navy); }
  .station .nm { font-size: 13.5px; font-weight: 700; color: #fff; margin-top: 11px; transition: color .15s; }
  .station.on .nm { color: var(--nc); }
  .station .ct { font-size: 11px; color: #9db3c2; margin-top: 2px; }

  .strip-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px 2px; }
  .film { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 4px; }
  /* enhanced sub-phase cards: phase-colour accent rail, icon chip, hover lift, glow-ring when selected */
  .fcard { position: relative; display: flex; flex-direction: column; min-height: 100px; background: var(--gradient-card); border: 1px solid transparent; border-radius: 12px; padding: 12px 15px 13px; cursor: pointer; text-align: left; font-family: inherit; overflow: hidden; transition: transform .16s, box-shadow .16s, background .2s, border-color .16s; animation: rise-sm .2s ease; }
  .fcard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--pc); opacity: .9; transition: width .16s; }
  .fcard:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -12px rgba(0,0,0,0.6); }
  /* selected - thicker left accent bar + a brighter surface, no surrounding ring */
  .fcard.on { background: linear-gradient(135deg, color-mix(in srgb, var(--pc) 32%, #275b63) 0%, color-mix(in srgb, var(--pc) 20%, #0d435f) 100%); }
  .fcard.on::before { width: 5px; }
  /* the brighter selected background washes out --ink-faint (#7d97a8) - lift the muted text */
  .fcard.on .fsid { color: var(--ink-2); }
  .fcard.on .fmeta { color: var(--ink-2); }
  .fcard.stub { background: none; border: 1px dashed var(--line); }
  .fcard.stub::before { opacity: .3; }
  .fcard .fhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .fcard .ficon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--pc) 22%, transparent); color: var(--pc); flex-shrink: 0; }
  .fcard .ficon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .fcard .fsid { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: #9db3c2; text-transform: uppercase; }
  .fcard .fnm { font-size: 14px; font-weight: 700; margin-top: 2px; line-height: 1.25; color: #fff; }
  .fcard .fmeta { font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: auto; padding-top: 8px; }
  .fcard .fhead .rbadge, .badge-new { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; background: var(--gradient-pill); color: var(--text-on-primary); padding: 3px 8px; border-radius: 20px; width: fit-content; flex-shrink: 0; white-space: nowrap; margin-top: 2px; }
  .badge-new { margin-top: 9px; }

  /* Detail panel wrapper */
  .panel { background: var(--navy-2); border-radius: 14px; padding: 30px 34px; margin-top: 20px; animation: rise .2s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise-sm { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* main content swap (view switch, sub-phase select, methodology switch, edit enter/exit) -
     replayed by render() via a remove/reflow/add class toggle, not just this static rule, since
     #main itself is the same persistent node across renders (only its children are replaced). */
  .main.page-enter { animation: rise .22s ease; }

  /* ---------- RACI grid ---------- */
  .rg-controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
  .rg-pfilters { display: flex; gap: 7px; flex-wrap: wrap; }
  .rg-pchip { font-family: inherit; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 15px; border: 1px solid transparent; cursor: pointer; transition: background .15s, color .15s, border-color .15s, opacity .15s; }
  .rg-legend { display: flex; gap: 14px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .rg-legend .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #b9cdd6; }
  .rg-legend .sw { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 10px; color: var(--text-on-primary); }
  .rg-focusbar { display: none; align-items: center; gap: 10px; background: rgba(63,224,197,0.08); border: 1px solid rgba(63,224,197,0.3); border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; font-size: 13px; }
  .rg-focusbar.show { display: flex; animation: rise-sm .2s ease; }
  .rg-focusbar b { color: var(--hs-mint); }
  .rg-focusbar button { margin-left: auto; font-family: inherit; font-size: 12px; font-weight: 600; color: #9fd; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; cursor: pointer; }
  .rg-scroller { overflow: auto; max-height: calc(100vh - 220px); border: 1px solid var(--line-soft); border-radius: 12px; }
  .rg-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
  .rg-table thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 3; padding: 11px 8px; text-align: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: #7fd8cb; border-bottom: 2px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; }
  .rg-table thead th:hover { background: #123a52; color: #fff; }
  .rg-table thead th.taskcol { position: sticky; left: 0; z-index: 4; text-align: left; width: 300px; min-width: 300px; cursor: default; background: var(--surface-2); }
  .rg-table thead th.focused { background: var(--teal); color: var(--text-on-primary); }
  .rg-table th .cnt { display: block; font-size: 9px; color: #5f9; font-weight: 400; margin-top: 2px; }
  .rg-table th.focused .cnt { color: var(--text-on-primary); }
  .rg-grouprow td { background: var(--surface-2); font-weight: 700; padding: 9px 12px; font-size: 12.5px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: sticky; left: 0; }
  .rg-grouprow .gsid { font-family: var(--font-mono); color: var(--text-on-primary); padding: 2px 9px; border-radius: 10px; margin-right: 9px; font-size: 11px; }
  .rg-table tr.taskrow { cursor: pointer; }
  .rg-table tr.taskrow:hover td { background: #0e2947; }
  .rg-table tbody td { padding: 10px 8px; border-bottom: 1px solid #142c44; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 12.5px; }
  .rg-table td.tname { position: sticky; left: 0; background: var(--paper); z-index: 1; text-align: left; font-family: var(--font-body); font-weight: 500; font-size: 13px; line-height: 1.4; width: 300px; min-width: 300px; }
  .rg-table tr.taskrow:hover td.tname { background: #0e2947; }
  .rg-table td.colhi, .rg-table th.colhi { background: #10314e !important; }
  .rg-table td.dimmed { opacity: 0.25; }
  .rg-lt { letter-spacing: 1px; }
  .rg-dash { color: #294863; }
  .rg-exrow { display: none; }
  .rg-exrow.show { display: table-row; }
  .rg-exrow td { background: var(--surface-flat); text-align: left; font-family: var(--font-body); font-weight: 400; padding: 14px 18px; border-bottom: 2px solid var(--line); position: sticky; left: 0; }
  .rg-exgrid { display: flex; gap: 34px; flex-wrap: wrap; animation: rise-sm .18s ease; }
  .rg-exgrid > div { flex: 1; min-width: 220px; }
  .rg-exgrid h5 { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hs-mint); margin: 0 0 6px; }
  .rg-exgrid p { margin: 0; color: #c3d5dd; font-size: 13px; line-height: 1.6; }
  .rg-exraci { display: flex; gap: 6px; flex-wrap: wrap; }
  .rg-exraci span { font-family: var(--font-mono); font-size: 11px; background: var(--surface-flat); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .rg-total td { background: var(--surface-2); font-family: var(--font-mono); font-size: 11px; color: #7fd8cb; border-top: 2px solid var(--line); padding: 9px 8px; text-align: center; }
  .rg-total td.tname { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--surface-2); z-index: 1; }

  .pcrumb { font-size: 12px; color: var(--hs-teal); font-weight: 600; margin-bottom: 8px; }

  /* sub-phase content header - Edit pencil lives here (right of the title), not in app chrome */
  .sp-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .edit-pencil { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(0,224,172,0.5); background: none; color: var(--teal); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.12s, box-shadow 0.12s; }
  .edit-pencil svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .edit-pencil:hover { background: var(--teal-wash); box-shadow: var(--shadow-md); }

  h1.sp-title {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 14px;
    color: #fff;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .prec {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--gradient-pill);
    color: var(--text-on-primary);
    font-size: 10px; font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    vertical-align: middle; margin-left: 8px;
  }

  .pchange {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--gradient-card-2);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 0 0 18px;
    font-size: 13.5px;
    color: #fff;
    max-width: 72ch;
  }
  .pchange b { color: #fff; }
  .pchange-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .pchange-list li { padding-left: 14px; position: relative; }
  .pchange-list li::before { content: '•'; position: absolute; left: 0; color: rgba(255,255,255,0.6); }
  .pchange-ts { color: rgba(255,255,255,0.65); font-size: 12px; }

  h4.sec {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--hs-teal);
    margin: 22px 0 8px;
    font-weight: 700;
  }
  .lede { font-size: 16px; line-height: 1.7; color: #f0f4f6; max-width: 72ch; margin: 14px 0; }
  .obj { font-size: 15px; line-height: 1.7; color: #cfe0ee; max-width: 72ch; margin: 0; }

  .metagrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 22px 0; }
  .metacard { background: var(--surface-2); border-radius: 10px; padding: 16px; }
  .metacard .mk { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #9db3c2; display: block; margin-bottom: 6px; }
  .metacard .who { display: flex; gap: 5px; flex-wrap: wrap; }
  .metacard .who span { font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.12); color: var(--ink); padding: 3px 9px; border-radius: 20px; cursor: help; }
  .loe-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; color: var(--ink); }
  .loe-list b { font-family: ui-monospace, monospace; font-size: 11px; color: var(--hs-teal); margin-right: 6px; }
  .loe-edit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; animation: rise-sm .16s ease; }
  .loe-edit-row:last-child { margin-bottom: 0; }
  .loe-abbr { font-family: ui-monospace, monospace; font-size: 11px; color: var(--hs-teal); width: 40px; flex-shrink: 0; }
  .loe-edit-row .edit-in { flex: 1; }
  .loe-billable { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; background: rgba(33,251,200,0.15); color: var(--hs-mint); border-radius: 5px; padding: 1px 6px; }
  /* tri-state flag: None / Billable / Optional - mutually exclusive, so a segmented control
     (not two independent checkboxes) is the honest representation of the data. */
  .loe-flag { display: inline-flex; gap: 2px; background: var(--surface-flat); border: 1px solid var(--line); border-radius: 20px; padding: 2px; flex-shrink: 0; }
  .loe-flag-btn { font-family: var(--font-body); font-size: 11.5px; font-weight: 600; color: var(--ink-faint); background: none; border: none; border-radius: 16px; padding: 4px 11px; cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; }
  .loe-flag-btn:hover { color: var(--ink-2); }
  .loe-flag-btn.on[data-loe-flag-val="billable"] { background: rgba(63,224,197,0.18); color: var(--hs-mint); }
  .loe-flag-btn.on[data-loe-flag-val="optional"] { background: rgba(240,185,90,0.18); color: #f0b95a; }
  .loe-flag-btn.on[data-loe-flag-val="none"] { background: rgba(255,255,255,0.1); color: var(--ink-2); }
  .loe-edit-row .x-btn { flex-shrink: 0; }
  /* modeled on the theme's input-switch mixin: off-track = $color-disabled, on-track = $brand-primary,
     knob stays white in both states, focus ring = $focus-ring-primary + $focus-ring-offset-medium */
  .loe-billable-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0; cursor: pointer; }
  /* "dark outlined" toggle - dark track + hairline border + muted knob when off, teal + white knob when on */
  .loe-billable-toggle input { appearance: none; -webkit-appearance: none; position: relative; width: 34px; height: 19px; border-radius: var(--radius-round); background: var(--surface-flat); border: 1px solid var(--line); cursor: pointer; margin: 0; flex-shrink: 0; transition: background .15s, border-color .15s; }
  .loe-billable-toggle input::after { content: ''; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px; border-radius: 50%; background: #8ba0b0; transition: transform .15s, background .15s; }
  .loe-billable-toggle input:checked { background: var(--hs-teal); border-color: var(--hs-teal); }
  .loe-billable-toggle input:checked::after { transform: translateX(15px); background: #fff; }
  .loe-billable-toggle input:focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-ring-offset); }

  /* Level of Effort - Style 1 rows-with-tags */

  .loe2 .row:nth-child(odd) { background: rgba(255,255,255,0.025); }

  .loe2 .eff { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .loe2 .eff.none { color: var(--ink-faint); }
  .loe2 .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .loe-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: .02em; }
  .loe-pill.bill { background: rgba(63,224,197,0.15); color: var(--hs-mint); border: 1px solid rgba(63,224,197,0.4); }
  .loe-pill.opt { background: rgba(240,185,90,0.14); color: #f0b95a; border: 1px dashed rgba(240,185,90,0.5); }
  .loe-all { display: flex; align-items: center; gap: 12px; padding: 8px; background: rgba(255,255,255,0.025); border-radius: 8px; font-size: 13px; }
  .loe-all .lr { font-weight: 800; color: var(--hs-teal); }
  .loe-all .eff { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
  .loe-all .eff.none { color: var(--ink-faint); }
  .loe-all .tags { display: flex; gap: 6px; }
  .loe-mode { display: inline-flex; gap: 2px; background: var(--surface-flat); border-radius: 8px; padding: 3px; margin-bottom: 12px; }
  .loe-mode-btn { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-faint); background: none; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; transition: background .15s, color .15s; }
  .loe-mode-btn.on { background: var(--gradient-pill); color: var(--text-on-primary); }

  /* job aids - read scope chips + editor */
  .ttbl .ja { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .ja-scope { font-family: var(--font-mono); font-size: 9px; font-weight: 700; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 42%, transparent); border-radius: 4px; padding: 0 4px; letter-spacing: .02em; }
  .ja-edit-wrap { margin-top: 20px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.22); }
  .ja-edit-lbl { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin-bottom: 12px; }
  .ja-edit-lbl svg { width: 13px; height: 13px; color: var(--teal); }
  .ja-edit { position: relative; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.18); border-left: 3px solid var(--teal); border-radius: 8px; padding: 16px; margin-bottom: 10px; animation: rise-sm .16s ease; }
  .ja-edit-row { display: flex; gap: 8px; align-items: center; }

  .ja-edit-row .link-ic svg { width: 15px; height: 15px; }
  /* exciting add-job-aid CTA - teal-tinted pill with an icon, fills on hover */
  .add-ja-btn { display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--teal); background: var(--teal-wash); border: 1px dashed color-mix(in srgb, var(--teal) 55%, transparent); border-radius: var(--radius-sm); padding: 10px 14px; cursor: pointer; transition: background .14s, color .14s, border-color .14s, box-shadow .14s; }
  .add-ja-btn .ja-plus { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, var(--teal) 22%, transparent); font-size: 14px; line-height: 1; }
  .add-ja-btn:hover { background: color-mix(in srgb, var(--teal) 20%, transparent); border-color: var(--teal); }
  .add-ja-btn:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
  .ja-roles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .ja-roles-lbl { font-size: 11px; color: var(--ink-2); margin-right: 2px; }
  .ja-rolechip { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--ink-2); background: none; border: 1px solid rgba(255,255,255,0.28); border-radius: 20px; padding: 3px 10px; cursor: pointer; transition: background .12s, color .12s, border-color .12s; }
  .ja-rolechip.on { color: var(--c, var(--hs-mint)); border-color: color-mix(in srgb, var(--c, var(--hs-mint)) 55%, transparent); background: color-mix(in srgb, var(--c, var(--hs-mint)) 16%, transparent); }
  .ja-rolechip[data-ja-allroles].on { color: var(--text-on-primary); background: var(--gradient-pill); border-color: transparent; }

  /* setup-zone blocks (LOE / participants / comments above the flow) */
  .setup-block { margin: 20px 0; }

  .notes { display: flex; gap: 10px; align-items: flex-start; background: rgba(255,255,255,0.03); border-left: 2px solid var(--line); border-radius: 0 8px 8px 0; padding: 10px 14px; }
  .notes svg { width: 15px; height: 15px; stroke: var(--ink-faint); fill: none; stroke-width: 2; flex-shrink: 0; margin-top: 2px; }
  .notes ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }

  .loe-edit-row .loe-billable-toggle + .loe-billable-toggle { margin-left: 2px; }

  .jargon-term {

  .task { background: var(--gradient-card); border-radius: 12px; padding: 14px 16px; }

  /* reorder arrows (edit mode) */
  .reorder-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; color: var(--ink-2); cursor: pointer; border-radius: 5px; padding: 0; transition: background .12s, color .12s; }
  .reorder-btn:hover:not(:disabled) { background: var(--teal-wash); color: var(--teal); }
  .reorder-btn:disabled { opacity: .26; cursor: default; }
  .reorder-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; }
  .te-tools .reorder-btn { width: 24px; height: 24px; }
  .row-reorder { position: absolute; top: 5px; right: 30px; display: flex; flex-direction: column; }
  .row-reorder .reorder-btn { width: 18px; height: 14px; }
  .te-num { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(0,224,172,0.18); color: var(--teal); font-family: var(--font-mono); font-size: 12px; font-weight: 800; }
  /* panel labels - kept light so they read clearly on the gradient */
  .raci-edit-lbl { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin: 18px 0 9px; }
  .task .tt { font-size: 14px; line-height: 1.4; color: var(--ink); margin-bottom: 10px; }
  .task .jobaid {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-body); font-size: 12px; color: var(--hs-mint); font-weight: 600;
    text-decoration: none; margin-bottom: 9px;
  }
  .task .jobaid svg { width: 13px; height: 13px; }
  .rchips { display: block; }
  .rchip {
    font-family: ui-monospace, monospace; font-size: 10.5px;
    background: rgba(255,255,255,0.15); border-radius: 6px;
    padding: 2px 7px; display: inline-block; margin-right: 5px; margin-bottom: 4px; cursor: help;
  }
  .rchip.off { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); cursor: default; }
  .rl-R { color: var(--r-r); }
  .rl-A { color: var(--r-a); }
  .rl-C { color: var(--r-c); }

  /* ---------- Reference view ---------- */
  .refdoc { max-width: 860px; }
  .ref-sec { margin-bottom: 34px; animation: rise .22s ease; }
  .ref-sec:nth-of-type(2) { animation-delay: .05s; }

  .ref-h { font-size: 17px; font-weight: 700; color: var(--ink); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
  .ref-count { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--teal); background: var(--teal-wash); border-radius: 20px; padding: 2px 10px; }
  .ref-lead { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin: 0 0 16px; max-width: 72ch; }
  .ref-raci-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 18px; }
  @media (min-width: 760px) { .ref-raci-grid { grid-template-columns: repeat(4, 1fr); } }
  .ref-raci-card { display: flex; gap: 12px; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; }
  .ref-raci-badge { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 800; font-size: 15px; background: rgba(255,255,255,0.07); }
  .ref-raci-name { font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 3px; }
  .ref-raci-desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .ref-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ref-rules li { font-size: 13.5px; color: var(--ink-2); line-height: 1.55; padding-left: 18px; position: relative; }
  .ref-rules li::before { content: '•'; position: absolute; left: 4px; color: var(--teal); }
  .ref-rules b { color: var(--ink); }
  .ref-rules .rl-A, .ref-rules .rl-R { font-family: var(--font-mono); font-weight: 700; }
  .ref-placeholder { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,0.03); border: 1px dashed var(--line); border-radius: 12px; padding: 18px 20px; }
  .ref-placeholder svg { width: 19px; height: 19px; stroke: var(--ink-faint); fill: none; stroke-width: 2; flex-shrink: 0; margin-top: 2px; }
  .ref-placeholder b { color: var(--ink); font-size: 14px; }
  .ref-placeholder p { font-size: 13px; color: var(--ink-faint); line-height: 1.55; margin: 4px 0 0; }
  .ref-aids { display: flex; flex-direction: column; gap: 10px; }
  .ref-aid { display: flex; gap: 14px; align-items: flex-start; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
  .ref-aid .jobaid { flex-shrink: 0; margin: 0; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--hs-mint); text-decoration: none; white-space: nowrap; }
  .ref-aid .jobaid svg { width: 13px; height: 13px; }
  .ref-aid .jobaid:hover { text-decoration: underline; }
  .ref-aid-body { flex: 1; min-width: 0; }
  .ref-aid-task { font-size: 13.5px; color: var(--ink); font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
  .ref-aid-crumb { display: inline-block; font-family: inherit; font-size: 12px; color: var(--hs-mint); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  .ref-aid-crumb:hover { text-decoration: underline; }
  .ref-aid-scope { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ref-allroles { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }

  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .idlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .idlist li { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; color: var(--ink); }
  @media (max-width: 640px) { .twocol { grid-template-columns: 1fr; } }

  /* ---------- Redesign: participants, scheduling, connected flow, task table ---------- */
  .plegend { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin: 20px 0 4px; }
  .plegend .plabel { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-right: 4px; }
  .rolechip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; background: rgba(255,255,255,.07); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; cursor: help; }
  .rolechip.ext { background: rgba(255,255,255,.03); color: var(--ink-2); border: 1px dashed var(--line); }


  .pipe { position: relative; padding-left: 32px; margin: 18px 0 8px; }
  .pipe::before { content: ''; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, #7c9cff, var(--hs-mint), #e0b34d); border-radius: 2px; opacity: .5; }

  .pstep .pshead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; margin: 0 0 3px; }
  .pstep h5 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--hs-teal); font-weight: 700; }
  .pstep h5 .muted { color: var(--ink-faint); font-weight: 400; letter-spacing: 0; text-transform: none; }
  .pstep .ordhint { font-size: 11px; color: var(--ink-faint); font-style: italic; margin: 0 0 9px; }
  .flowlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; counter-reset: io; }
  .flowlist li { background: var(--surface-2); border-radius: 9px; padding: 9px 12px 9px 34px; font-size: 13px; color: var(--ink-2); line-height: 1.4; position: relative; }
  .flowlist li::before { counter-increment: io; content: counter(io); position: absolute; left: 11px; top: 9px; width: 15px; height: 15px; border-radius: 50%; background: rgba(255,255,255,.08); color: var(--ink-faint); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }
  .flowlist li.none { padding-left: 12px; color: var(--ink-faint); font-style: italic; }
  .flowlist li.none::before { display: none; }

  .ttbl-wrap { overflow-x: auto; }
  table.ttbl { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.ttbl th, table.ttbl td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--line); }
  table.ttbl th.tname, table.ttbl td.tname { text-align: left; width: 46%; color: var(--ink); font-weight: 600; font-size: 14.5px; line-height: 1.4; }

  table.ttbl thead th.pcol.ext { border-bottom-style: dashed; }

  table.ttbl td.cell.off { color: rgba(255,255,255,.16); font-weight: 400; }
  table.ttbl tbody tr:hover { background: rgba(255,255,255,.03); }
  table.ttbl .jobaid { display: inline-block; font-size: 11px; color: var(--hs-mint); font-weight: 600; text-decoration: none; white-space: nowrap; margin-top: 3px; }
  .rlegend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-size: 11px; color: var(--ink-faint); }
  .rlegend .lg { display: inline-flex; align-items: center; gap: 5px; }
  .rlegend .sw { font-family: var(--font-mono); font-weight: 700; width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: #06121c; font-size: 11px; }


  /* ---------- Tooltip ---------- */
  .tip {
    position: fixed;
    z-index: 100;
    max-width: 260px;
    background: #04131f;
    color: #fff;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tip.show { opacity: 1; }
  .tip .tname { font-family: var(--font-mono); font-size: 11px; color: var(--hs-mint); display: block; margin-bottom: 3px; letter-spacing: 0.04em; }

  /* ---------- Edit mode ---------- */
  .editing .main { background: repeating-linear-gradient(45deg, transparent, transparent 22px, rgba(255,210,63,0.045) 22px, rgba(255,210,63,0.045) 23px); }
  /* Everything above the sub-phase title (page header + the roadmap/sub-phase-card strip) is
     already functionally inert while editing - openSubPhase() and the phase-pill handler both
     no-op during editMode - this just makes that visible: blurred + faded so the eye has nowhere
     to go but the edit panel below. pointer-events:none backs up the existing JS guards. */
  .editing .pagehdr, .editing .journey-chrome { opacity: .5; filter: blur(2.5px) saturate(.7); pointer-events: none; transition: filter .2s, opacity .2s; }
  .edit-in {
    width: 100%;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    background: #0e2740;
    resize: vertical;
    outline: none;
  }
  .edit-in::placeholder { color: var(--ink-faint); }
  .edit-in:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(23,184,166,0.22); }
  textarea.edit-in { line-height: 1.5; }
  /* custom-styled selects - no browser-default chrome, themed chevron */
  select.edit-in {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    padding: 8px 34px 8px 12px;

function normLoeEntry(v) {
  if (typeof v === 'string') { v = { text: v }; }
  else if (!v || typeof v !== 'object') { v = {}; }

  const billable = !!v.billable;

function normalizeLoe(loe) {
  if (!loe || typeof loe !== 'object') { loe = {}; }

  if ('mode' in loe || 'all' in loe || 'roles' in loe) {
    return {
      mode: loe.mode === 'byRole' ? 'byRole' : 'all',
      all: normLoeEntry(loe.all),
      roles: (() => { const r = {}; Object.keys(loe.roles || {}).forEach(k => { r[k] = normLoeEntry(loe.roles[k]); }); return r; })()
    };
  }
  // legacy { jobTitleId: {...} } → collapse to a single value when uniform, else per-role
  const keys = Object.keys(loe);
  if (!keys.length) { return { mode: 'all', all: normLoeEntry(), roles: {} }; }
  const entries = keys.map(k => normLoeEntry(loe[k]));
  const first = entries[0];
  const uniform = entries.every(e => e.text === first.text && e.billable === first.billable && e.optional === first.optional);
  if (uniform) { return { mode: 'all', all: { ...first }, roles: {} }; }

}

  changes.push(...diffListField(before.comments, after.comments, 'Comment'));

  const beforeTasks = new Map((before.tasks || []).map(t => [t.id, t]));
  const afterTasks = new Map((after.tasks || []).map(t => [t.id, t]));
  afterTasks.forEach((t, id) => {
    const label = truncateText(t.text, 50);
    if (!beforeTasks.has(id)) { changes.push(`Task added: “${label}”`); return; }
    const bt = beforeTasks.get(id);
    if (bt.text !== t.text) { changes.push(`Task edited: “${label}”`); }
    if (JSON.stringify(bt.jobAids || []) !== JSON.stringify(t.jobAids || [])) { changes.push(`Job aids updated on “${label}”`); }
    changes.push(...diffRaci(bt.raci, t.raci, label));
  });
  beforeTasks.forEach((t, id) => {
    if (!afterTasks.has(id)) { changes.push(`Task removed: “${truncateText(t.text, 50)}”`); }
  });
  return changes;
}

let lastRenderKey = null;
function render() {
  document.getElementById('app').classList.toggle('editing', state.editMode);
  updatePageHeader();
  renderMain();
  // Replay the content entrance animation only when something actually NAVIGATED (view,
  // sub-phase, or edit-mode changed) - not on every micro-edit inside the edit form, which
  // also flows through render()'s callers indirectly via reRenderEdit -> renderBrowse (a
  // DIFFERENT function that bypasses render() entirely, so it never hits this at all) but we
  // still guard here in case future code calls render() itself during in-place edits.
  const key = state.view + '|' + state.subPhaseId + '|' + state.editMode;
  if (key !== lastRenderKey) {
    main.classList.remove('page-enter');
    void main.offsetWidth; // force reflow so the animation restarts instead of being a no-op
    main.classList.add('page-enter');
  }
  lastRenderKey = key;
}

  for (let i = 0; i < m.phases.length; i++) {

function subPhaseIconKey(name) {

  if (/kickoff/.test(n)) { return 'flag'; }

  if (/build/.test(n)) { return 'code'; }

  html += `<h4 class="sec">Objective</h4><textarea class="edit-in" id="f-objective" rows="4">${esc(sp.objective)}</textarea>`;

  html += '<div class="metagrid" style="grid-template-columns:1fr">';
  html += `<div class="metacard"><span class="mk">Level of Effort</span><div id="edit-loe">${loeEditHtml(sp)}</div><p class="edit-hint">Same for all participants, or add roles one at a time for a per-role breakdown.</p></div>`;
  html += `<div class="metacard"><span class="mk">Comments</span><div id="edit-comments">${listEditHtml(sp.comments, 'comment')}</div><button class="add-item-btn tight" data-add="comment">+ Add comment</button></div>`;
  html += `<div class="metacard"><span class="mk">Participants</span><p style="font-size:13px;color:var(--ink-faint);margin:0">Auto-derived from task RACI below - nothing to edit here.</p></div>`;
  html += '</div>';

  html += `<div class="sechead"><h4 class="sec">Tasks</h4></div><div id="edit-tasks">`;
  sp.tasks.forEach((t, ti) => { html += taskEditHtml(t, ti, sp.tasks.length); });
  html += `</div><button class="add-item-btn" data-add="task">+ Add task</button>`;

  html += '<div class="twocol" style="margin-top:24px">';
  html += `<div><h4 class="sec">Inputs</h4><div id="edit-inputs">${listEditHtml(sp.inputs, 'input')}</div><button class="add-item-btn tight" data-add="input">+ Add input</button></div>`;
  html += `<div><h4 class="sec">Deliverables</h4><div id="edit-deliverables">${listEditHtml(sp.deliverables, 'deliverable')}</div><button class="add-item-btn tight" data-add="deliverable">+ Add deliverable</button></div>`;
  html += '</div>';

  return html;
}

function listEditHtml(arr, kind) {
  return arr.map((v, i) => `<div class="list-edit-row">
    <textarea class="edit-in" data-list="${kind}" data-idx="${i}" rows="2">${esc(v)}</textarea>
    <div class="row-reorder">
      <button class="reorder-btn" data-move="${kind}:${i}:up" ${i === 0 ? 'disabled' : ''} title="Move up" aria-label="Move up">${CHEVUP_SVG}</button>
      <button class="reorder-btn" data-move="${kind}:${i}:down" ${i === arr.length - 1 ? 'disabled' : ''} title="Move down" aria-label="Move down">${CHEVDOWN_SVG}</button>
    </div>
    <button class="field-x" data-del-list="${kind}" data-idx="${i}" title="Remove" aria-label="Remove">×</button>
  </div>`).join('');
}

function taskEditHtml(t, ti, n) {
  let h = `<div class="task" data-task-idx="${ti}">`;
  h += `<div class="te-head"><span class="te-num">${ti + 1}</span><span class="te-tools">`
    + `<button class="reorder-btn" data-move="task:${ti}:up" ${ti === 0 ? 'disabled' : ''} title="Move up" aria-label="Move task up">${CHEVUP_SVG}</button>`
    + `<button class="reorder-btn" data-move="task:${ti}:down" ${ti === n - 1 ? 'disabled' : ''} title="Move down" aria-label="Move task down">${CHEVDOWN_SVG}</button>`
    + `<button class="x-btn" data-del-task="${ti}" title="Delete task" aria-label="Delete task">×</button>`
    + `</span></div>`;
  h += `<textarea class="edit-in te-text" data-task-field="text" data-idx="${ti}" rows="2" placeholder="Describe the task">${esc(t.text)}</textarea>`;
  // RACI matrix
  h += `<span class="raci-edit-lbl">Responsibility (RACI)</span>`;
  h += '<div class="raci-matrix">';
  sortJobTitleIds(Object.keys(t.raci || {})).forEach(rid => {
    const r = jobTitleById(rid);
    if (!r) { return; }
    h += `<div class="raci-matrix-row">
      <span class="rm-name"><span class="abbr">${esc(r.abbr)}</span>${esc(r.name)}</span>`;
    RACI_LETTERS.forEach(l => {
      const on = t.raci[rid].includes(l);
      h += `<button class="raci-toggle ${on ? 'on t-' + l : ''}" data-raci-task="${ti}" data-raci-jt="${rid}" data-raci-letter="${l}">${l}</button>`;
    });
    h += `<button class="x-btn" data-raci-remove-task="${ti}" data-raci-remove-jt="${rid}" title="Remove job title" aria-label="Remove job title">×</button></div>`;
  });
  // add job title
  const used = Object.keys(t.raci || {});
  const avail = data.jobTitles.filter(r => !used.includes(r.id));
  const coreMissing = CORE_TEAM.some(id => !used.includes(id));
  if (avail.length) {
    h += `<div class="add-jt-row"><select class="edit-in" data-add-jt-task="${ti}"><option value="">+ Add job title…</option>`;
    if (coreMissing) { h += '<option value="__core__">+ Core technical team (EM, BPC, ARCH, TC)</option>'; }
    avail.forEach(r => { h += `<option value="${r.id}">${esc(r.abbr)} - ${esc(r.name)}</option>`; });
    h += '</select></div>';
  }
  h += '</div>';
  // job aids
  h += `<div class="ja-edit-wrap"><span class="ja-edit-lbl">${LINK_SVG}Job aids</span>`;
  (t.jobAids || []).forEach((j, ji) => { h += jobAidEditHtml(t, ti, j, ji); });
  h += `<button class="add-ja-btn" data-ja-add="${ti}"><span class="ja-plus">+</span>Add job aid</button></div>`;
  h += '</div>'; // .task
  return h;
}
function jobAidEditHtml(t, ti, j, ji) {
  const roleIds = sortJobTitleIds(Object.keys(t.raci || {}));
  const allOn = !j.roles || !j.roles.length;
  let chips = `<button class="ja-rolechip ${allOn ? 'on' : ''}" data-ja-allroles="${ti}:${ji}" type="button">All roles</button>`;
  chips += roleIds.map(rid => {
    const r = jobTitleById(rid);
    if (!r) { return ''; }
    const on = (j.roles || []).includes(rid);
    return `<button class="ja-rolechip ${on ? 'on' : ''}" data-ja-role="${ti}:${ji}:${rid}" type="button" style="--c:${jobTitleColor(rid)}">${r.external ? '◇ ' : ''}${esc(r.abbr)}</button>`;
  }).join('');
  return `<div class="ja-edit">
    <div class="ja-edit-row">
      <span class="link-ic">${LINK_SVG}</span>
      <input class="edit-in" data-ja-idx="${ti}:${ji}" data-ja-field="url" value="${esc(j.url)}" placeholder="Job aid URL" style="flex:1" />
      <button class="x-btn" data-ja-del="${ti}:${ji}" title="Remove job aid" aria-label="Remove job aid">×</button>
    </div>
    <div class="ja-roles"><span class="ja-roles-lbl">Applies to:</span>${chips}</div>
  </div>`;
}

function wireEditHandlers(sp) {
  document.getElementById('editCancel').onclick = cancelEdit;
  document.getElementById('editSave').onclick = saveEdit;

  const bind = (id, field) => {
    const el = document.getElementById(id);
    if (el) { el.oninput = () => { sp[field] = el.value; save(); }; }
  };
  bind('f-name', 'name');
  bind('f-overview', 'overview');
  bind('f-objective', 'objective');

  // reorder tasks / inputs / deliverables / comments (▲ / ▼)
  const moveArrFor = kind => kind === 'task' ? sp.tasks
    : kind === 'input' ? sp.inputs
    : kind === 'deliverable' ? sp.deliverables
    : kind === 'comment' ? sp.comments : null;
  main.querySelectorAll('[data-move]').forEach(b => {
    b.onclick = () => {
      const [kind, idxStr, dir] = b.dataset.move.split(':');
      const arr = moveArrFor(kind);
      if (!arr) { return; }
      const i = +idxStr, j = dir === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= arr.length) { return; }
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      if (kind === 'task') { arr.forEach((t, k) => { t.order = k + 1; }); }
      save(); reRenderEdit();
    };
  });

  if (!sp.levelOfEffort) { sp.levelOfEffort = { mode: 'all', all: { text: '', billable: false, optional: false }, roles: {} }; }
  const loeTarget = key => {
    const loe = sp.levelOfEffort;
    if (key === 'all') { if (!loe.all) { loe.all = { text: '', billable: false, optional: false }; } return loe.all; }
    const rid = key.slice(5); // strip 'role:'
    if (!loe.roles) { loe.roles = {}; }
    if (!loe.roles[rid]) { loe.roles[rid] = { text: '', billable: false, optional: false }; }
    return loe.roles[rid];
  };
  main.querySelectorAll('[data-loe-mode]').forEach(b => {
    b.onclick = () => {
      const mode = b.dataset.loeMode;
      sp.levelOfEffort.mode = mode;
      // seed "Per role" with today's task participants the first time it's opened, so it's not
      // empty - after that, roles are fully manual (add/remove below).
      if (mode === 'byRole' && !Object.keys(sp.levelOfEffort.roles || {}).length) {
        if (!sp.levelOfEffort.roles) { sp.levelOfEffort.roles = {}; }
        derivedParticipants(sp).filter(r => !r.external).forEach(r => {
          sp.levelOfEffort.roles[r.id] = { text: '', billable: false, optional: false };
        });
      }
      save(); reRenderEdit();
    };
  });
  main.querySelectorAll('input[data-loe-key]').forEach(el => {
    const apply = () => { loeTarget(el.dataset.loeKey)[el.dataset.loeField] = el.value; save(); };
    el.oninput = apply;
  });
  main.querySelectorAll('[data-loe-flag-key]').forEach(b => {
    b.onclick = () => {
      const t = loeTarget(b.dataset.loeFlagKey);
      const val = b.dataset.loeFlagVal;
      t.billable = (val === 'billable');
      t.optional = (val === 'optional');
      save(); reRenderEdit();
    };
  });
  main.querySelectorAll('[data-add-loe-role]').forEach(sel => {
    sel.onchange = () => {
      const rid = sel.value;
      if (!rid) { return; }
      if (!sp.levelOfEffort.roles) { sp.levelOfEffort.roles = {}; }
      if (!sp.levelOfEffort.roles[rid]) { sp.levelOfEffort.roles[rid] = { text: '', billable: false, optional: false }; }
      save(); reRenderEdit();
    };
  });
  main.querySelectorAll('[data-loe-role-del]').forEach(b => {
    b.onclick = () => { delete sp.levelOfEffort.roles[b.dataset.loeRoleDel]; save(); reRenderEdit(); };
  });

  // list fields (inputs / deliverables / comments)
  const listArr = kind => kind === 'input' ? sp.inputs : kind === 'deliverable' ? sp.deliverables : sp.comments;
  main.querySelectorAll('[data-list]').forEach(el => {
    el.oninput = () => {
      const arr = listArr(el.dataset.list);
      arr[+el.dataset.idx] = el.value; save();
    };
  });
  main.querySelectorAll('[data-del-list]').forEach(b => {
    b.onclick = () => {
      const arr = listArr(b.dataset.delList);
      arr.splice(+b.dataset.idx, 1); save(); reRenderEdit();
    };
  });
  // add list item / task
  main.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = () => {
      if (b.dataset.add === 'input') { sp.inputs.push(''); }
      else if (b.dataset.add === 'deliverable') { sp.deliverables.push(''); }
      else if (b.dataset.add === 'comment') { sp.comments.push(''); }
      else if (b.dataset.add === 'task') { sp.tasks.push({ id: 't' + Date.now(), order: sp.tasks.length + 1, text: '', jobAids: [], raci: {} }); }
      save(); reRenderEdit();
    };
  });
  // task fields
  main.querySelectorAll('[data-task-field]').forEach(el => {
    el.oninput = () => { sp.tasks[+el.dataset.idx][el.dataset.taskField] = el.value; save(); };
  });
  main.querySelectorAll('[data-del-task]').forEach(b => {
    b.onclick = () => { sp.tasks.splice(+b.dataset.delTask, 1); save(); reRenderEdit(); };
  });
  // job aids
  const jaAt = (ti, ji) => sp.tasks[+ti].jobAids[+ji];
  main.querySelectorAll('[data-ja-field]').forEach(el => {
    el.oninput = () => { const [ti, ji] = el.dataset.jaIdx.split(':'); jaAt(ti, ji)[el.dataset.jaField] = el.value; save(); };
  });
  main.querySelectorAll('[data-ja-add]').forEach(b => {
    b.onclick = () => { const t = sp.tasks[+b.dataset.jaAdd]; if (!Array.isArray(t.jobAids)) { t.jobAids = []; } t.jobAids.push({ id: 'ja' + (jaSeq++), url: '', roles: [] }); save(); reRenderEdit(); };
  });
  main.querySelectorAll('[data-ja-del]').forEach(b => {
    b.onclick = () => { const [ti, ji] = b.dataset.jaDel.split(':'); sp.tasks[+ti].jobAids.splice(+ji, 1); save(); reRenderEdit(); };
  });
  main.querySelectorAll('[data-ja-allroles]').forEach(b => {
    b.onclick = () => { const [ti, ji] = b.dataset.jaAllroles.split(':'); jaAt(ti, ji).roles = []; save(); reRenderEdit(); };
  });
  main.querySelectorAll('[data-ja-role]').forEach(b => {
    b.onclick = () => {
      const [ti, ji, rid] = b.dataset.jaRole.split(':');
      const arr = jaAt(ti, ji).roles;
      const i = arr.indexOf(rid);
      if (i >= 0) { arr.splice(i, 1); } else { arr.push(rid); }
      save(); reRenderEdit();
    };
  });
  // raci toggles
  main.querySelectorAll('[data-raci-task]').forEach(b => {
    b.onclick = () => {
      const t = sp.tasks[+b.dataset.raciTask];
      const rid = b.dataset.raciJt;
      const l = b.dataset.raciLetter;
      const arr = t.raci[rid] || (t.raci[rid] = []);
      const i = arr.indexOf(l);
      if (i >= 0) { arr.splice(i, 1); } else { arr.push(l); arr.sort((a, z) => RACI_LETTERS.indexOf(a) - RACI_LETTERS.indexOf(z)); }
      save(); reRenderEdit();
    };
  });
  main.querySelectorAll('[data-raci-remove-task]').forEach(b => {
    b.onclick = () => { delete sp.tasks[+b.dataset.raciRemoveTask].raci[b.dataset.raciRemoveJt]; save(); reRenderEdit(); };
  });
  main.querySelectorAll('[data-add-jt-task]').forEach(sel => {
    sel.onchange = () => {
      if (!sel.value) { return; }
      const raci = sp.tasks[+sel.dataset.addJtTask].raci;
      if (sel.value === '__core__') {
        CORE_TEAM.forEach(id => { if (!raci[id]) { raci[id] = []; } });
      } else {
        raci[sel.value] = [];
      }
      save(); reRenderEdit();
    };
  });
}
function reRenderEdit() {
  renderBrowse();
}

function enterEdit() {
  if (state.view !== 'browse') { state.view = 'browse'; }
  const loc = findSubPhase(state.subPhaseId);
  if (!loc) { return; }
  state.editSnapshot = deepClone(loc.sp);
  state.editMode = true;
  render();
}
function cancelEdit() {
  const loc = findSubPhase(state.subPhaseId);
  if (loc && state.editSnapshot) {
    Object.keys(loc.sp).forEach(k => delete loc.sp[k]);
    Object.assign(loc.sp, state.editSnapshot);
  }
  state.editMode = false;
  state.editSnapshot = null;
  save();
  render();
  toast('Edit cancelled - changes reverted');
}
function saveEdit() {
  const loc = findSubPhase(state.subPhaseId);
  const changeTexts = describeChanges(state.editSnapshot, loc.sp);
  let newEntries = [];
  if (changeTexts.length) {
    if (!loc.sp.changelog) { loc.sp.changelog = []; }
    newEntries = changeTexts.map(text => ({ id: 'c' + (changelogSeq++), ts: TODAY, text, read: false }));
    loc.sp.changelog.unshift(...newEntries);
  }
  state.editMode = false;
  state.editSnapshot = null;
  state.justRead = newEntries;
  save();
  render();
  toast(changeTexts.length ? `Saved - ${changeTexts.length} change${changeTexts.length > 1 ? 's' : ''} detected and logged automatically` : 'Saved - no changes detected');
}

/* ---------------- RACI grid ---------------- */
function rgJtIds() {
  const ids = [];
  curMeth().phases.forEach(p => p.subPhases.forEach(s => {
    if (hasContent(s)) { s.tasks.forEach(t => Object.keys(t.raci || {}).forEach(id => { if (!ids.includes(id)) { ids.push(id); } })); }
  }));
  return sortJobTitleIds(ids);
}
function rgCounts() {
  const c = {};
  curMeth().phases.forEach(p => {
    if (!rgActivePhases.has(p.name)) { return; }
    p.subPhases.forEach(s => { if (hasContent(s)) { s.tasks.forEach(t => Object.keys(t.raci || {}).forEach(id => { c[id] = (c[id] || 0) + t.raci[id].length; })); } });
  });
  return c;
}
function renderRaci() {
  const m = curMeth();
  const names = m.phases.map(p => p.name);
  if (!rgActivePhases || [...rgActivePhases].some(n => !names.includes(n))) { rgActivePhases = new Set(names); }
  const ids = rgJtIds();
  const counts = rgCounts();
  let rgRowSeq = 0;

  let html = '';

  html += '<div class="meth-tabs" style="display:inline-flex;margin-bottom:18px">';
  html += `<button class="meth-tab ${raciMode === 'grid' ? 'active' : ''}" data-rgmode="grid">Grid</button>`;
  html += `<button class="meth-tab ${raciMode === 'byrole' ? 'active' : ''}" data-rgmode="byrole">By Role</button>`;
  html += '</div>';

  if (raciMode === 'byrole') {
    if (!rgFocusJob || !ids.includes(rgFocusJob)) { rgFocusJob = ids[0] || null; }
    html += '<div class="jt-picker">';
    ids.forEach(id => {
      const jt = jobTitleById(id);
      html += `<button class="jt-pick-btn ${rgFocusJob === id ? 'active' : ''}" data-rgby="${id}"><span class="abbr">${esc(jt.abbr)}</span>${esc(jt.name)}<span class="n">${counts[id] || 0}</span></button>`;
    });
    html += '</div>';
    if (rgFocusJob) {
      m.phases.filter(p => rgActivePhases.has(p.name)).forEach(p => {
        const pColor = PHASE_COLORS[m.phases.indexOf(p) % PHASE_COLORS.length];
        p.subPhases.filter(s => hasContent(s)).forEach(s => {
          const matched = s.tasks.filter(t => t.raci[rgFocusJob]);
          if (!matched.length) { return; }
          html += `<div class="jt-group"><div class="jt-group-head"><span class="sid" style="background:${pColor}">${esc(s.sid)}</span>${esc(p.name)} - ${esc(s.name)}</div>`;
          matched.forEach(t => {
            const letters = t.raci[rgFocusJob].map(l => `<span class="rl-${l}">${l}</span>`).join('');
            html += `<div class="jt-task"><span class="rt-raci">${letters}</span><div><div class="rt-text">${esc(t.text)}</div><a class="rt-jump rt-loc" data-jump="${s.id}">${esc(p.name)} › ${esc(s.sid)} ${esc(s.name)} ↗</a></div></div>`;
          });
          html += '</div>';
        });
      });
    } else {
      html += '<p class="empty">No job titles have tasks yet.</p>';
    }
    main.innerHTML = html;
    wireMethSwitch();
    main.querySelectorAll('[data-rgmode]').forEach(b => b.onclick = () => { raciMode = b.dataset.rgmode; renderRaci(); });
    main.querySelectorAll('[data-rgby]').forEach(b => b.onclick = () => { rgFocusJob = b.dataset.rgby; renderRaci(); });
    main.querySelectorAll('[data-jump]').forEach(a => a.onclick = () => openSubPhase(a.dataset.jump));
    return;
  }

  html += '<div class="rg-controls"><div class="rg-pfilters">';
  m.phases.forEach((p, i) => {
    const on = rgActivePhases.has(p.name);
    const c = PHASE_COLORS[i % PHASE_COLORS.length];
    html += `<button class="rg-pchip" data-rgp="${esc(p.name)}" style="background:${on ? c : 'var(--surface-flat)'};color:${on ? 'var(--text-on-primary)' : 'var(--ink-soft)'};border-color:${on ? '#fff' : 'var(--line)'};box-shadow:${on ? 'var(--shadow-inset)' : 'none'}">${esc(p.name)}</button>`;
  });
  html += '</div><div class="rg-legend">';
  RACI_LETTERS.forEach(l => { html += `<span class="lg"><span class="sw" style="background:${RACI_HEX[l]}">${l}</span>${RACI_NAMES[l]}</span>`; });
  html += '</div></div>';

  if (rgFocusJob) {
    const jt = jobTitleById(rgFocusJob);
    html += `<div class="rg-focusbar show">Focused on <b>&nbsp;${esc(jt.name)}</b>&nbsp;- showing only tasks where they carry a RACI designation.<button id="rgClear">Clear focus</button></div>`;
  }

  html += '<div class="rg-scroller"><table class="rg-table"><thead><tr><th class="taskcol">Task</th>';
  ids.forEach(id => {
    const foc = rgFocusJob === id ? ' focused' : '';
    html += `<th class="jt${foc}" data-rgcol="${id}">${esc(jobTitleById(id).abbr)}<span class="cnt">${counts[id] || 0}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  let body = '';
  m.phases.filter(p => rgActivePhases.has(p.name)).forEach(p => {
    const pColor = PHASE_COLORS[m.phases.indexOf(p) % PHASE_COLORS.length];
    p.subPhases.filter(s => hasContent(s)).forEach(s => {
      const rows = rgFocusJob ? s.tasks.filter(t => t.raci[rgFocusJob]) : s.tasks;
      if (!rows.length) { return; }
      body += `<tr class="rg-grouprow" data-rgsid="${esc(s.id)}"><td colspan="${ids.length + 1}"><span class="gsid" style="background:${pColor}">${esc(s.sid)}</span>${esc(p.name)} - ${esc(s.name)}</td></tr>`;
      rows.forEach(t => {
        const rid = 'rgex' + (rgRowSeq++);
        const cells = ids.map(id => {
          const dim = rgFocusJob && id !== rgFocusJob ? ' dimmed' : '';
          if (!t.raci[id]) { return `<td class="rgcell${dim}" data-rgcell="${id}"><span class="rg-dash">–</span></td>`; }
          const lt = t.raci[id].map(l => `<span class="rl-${l}">${l}</span>`).join('');
          return `<td class="rgcell${dim}" data-rgcell="${id}"><span class="rg-lt">${lt}</span></td>`;
        }).join('');
        body += `<tr class="taskrow" data-rgex="${rid}"><td class="tname">${esc(t.text)}</td>${cells}</tr>`;
        const exraci = sortJobTitleIds(Object.keys(t.raci)).map(id => `<span><b>${esc(jobTitleById(id).abbr)}</b> ${t.raci[id].map(l => RACI_NAMES[l]).join(', ')}</span>`).join('');
        body += `<tr class="rg-exrow" id="${rid}"><td colspan="${ids.length + 1}"><div class="rg-exgrid"><div><h5>Phase context</h5><p>${esc(s.overview || '-')}</p></div><div><h5>This task - full RACI</h5><div class="rg-exraci">${exraci}</div></div></div></td></tr>`;
      });
    });
  });
  if (!body) { body = `<tr><td class="tname" colspan="${ids.length + 1}" style="padding:26px;color:var(--ink-faint)">No tasks match the current filters.</td></tr>`; }
  html += body + '</tbody><tfoot><tr class="rg-total"><td class="tname">Total involvements</td>' + ids.map(id => `<td>${counts[id] || 0}</td>`).join('') + '</tr></tfoot></table></div>';

  main.innerHTML = html;
  wireMethSwitch();
  main.querySelectorAll('[data-rgmode]').forEach(b => b.onclick = () => { raciMode = b.dataset.rgmode; renderRaci(); });
  main.querySelectorAll('[data-rgp]').forEach(b => b.onclick = () => {
    const n = b.dataset.rgp;
    if (rgActivePhases.has(n)) { rgActivePhases.delete(n); } else { rgActivePhases.add(n); }
    renderRaci();
  });
  main.querySelectorAll('th[data-rgcol]').forEach(th => {
    th.onmouseenter = () => {
      if (rgFocusJob) { return; }
      main.querySelectorAll('[data-rgcell="' + th.dataset.rgcol + '"]').forEach(td => td.classList.add('colhi'));
      th.classList.add('colhi');
    };
    th.onmouseleave = () => { main.querySelectorAll('.colhi').forEach(el => el.classList.remove('colhi')); };
    th.onclick = () => { rgFocusJob = rgFocusJob === th.dataset.rgcol ? null : th.dataset.rgcol; renderRaci(); };
  });
  const clr = document.getElementById('rgClear');
  if (clr) { clr.onclick = () => { rgFocusJob = null; renderRaci(); }; }
  main.querySelectorAll('.taskrow[data-rgex]').forEach(tr => tr.onclick = () => {
    const ex = document.getElementById(tr.dataset.rgex);
    const open = ex.classList.contains('show');
    main.querySelectorAll('.rg-exrow.show').forEach(e => e.classList.remove('show'));
    if (!open) { ex.classList.add('show'); }
  });
}

/* ---------------- What's New ---------------- */
function renderWhatsNew() {
  const items = [];
  data.methodologies.forEach(m => m.phases.forEach((p, pi) => p.subPhases.forEach(s => {
    unreadEntries(s).forEach(entry => items.push({ m, p, pi, s, entry }));
  })));
  items.sort((a, b) => Date.parse(b.entry.ts) - Date.parse(a.entry.ts));

  let html = '';
  if (!items.length) { html += '<p class="empty">Nothing unread. You’re caught up.</p>'; }
  items.forEach(it => {
    const color = PHASE_COLORS[it.pi % PHASE_COLORS.length];
    html += `<button class="whatsnew-item" data-jump="${it.s.id}" data-meth="${it.m.id}">
      <div class="wn-top">
        <span class="wn-loc" style="background:${color}">${esc(it.m.name)} · ${esc(it.s.sid)}</span>
        <span class="wn-title">${esc(it.s.name)}</span>
        <span class="wn-date">${esc(fmtDate(it.entry.ts))} · ${daysAgo(it.entry.ts)}d ago</span>
      </div>
      <div class="wn-summary">${esc(it.entry.text)}</div>
    </button>`;
  });
  main.innerHTML = html;
  main.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    if (b.dataset.meth !== state.methodologyId) { state.methodologyId = b.dataset.meth; }
    jumpTo(b.dataset.jump);
  });
}

/* ---------------- Reference (RACI explainer · escalation · job-aids index) ---------------- */
function raciDefCard(letter, name, desc) {
  return `<div class="ref-raci-card"><span class="ref-raci-badge rl-${letter}">${letter}</span><div><div class="ref-raci-name">${name}</div><div class="ref-raci-desc">${desc}</div></div></div>`;
}
function renderReference() {
  let html = '<div class="refdoc">';

  // 1 · How to use RACI (generic, well-established guidance)
  html += `<section class="ref-sec">
    <h3 class="ref-h">How to use RACI</h3>
    <p class="ref-lead">Every task in this playbook assigns each involved job title one or more RACI letters. They answer one question: for this task, what is that person's relationship to the work?</p>
    <div class="ref-raci-grid">
      ${raciDefCard('R', 'Responsible', 'Does the work. At least one per task - the people who actually carry it out.')}
      ${raciDefCard('A', 'Accountable', 'Owns the outcome and signs off. Exactly one per task - the single point of ownership.')}
      ${raciDefCard('C', 'Consulted', 'Two-way input. Consulted for their expertise before or while the work happens.')}
      ${raciDefCard('I', 'Informed', 'One-way update. Kept informed of progress or completion, but not part of the doing.')}
    </div>
    <ul class="ref-rules">
      <li><b>Exactly one A per task.</b> Accountability shouldn't be shared - if two people sign off, no one does.</li>
      <li><b>R and A can be the same person</b> (shown together as <span class="rl-A">A</span> <span class="rl-R">R</span>) - they do it and own it.</li>
      <li><b>Every task needs at least an R and an A</b> - someone doing the work, someone owning the result.</li>
      <li><b>The customer</b> appears in the RACI wherever the engagement requires their input, approval, or participation.</li>
    </ul>
  </section>`;

  // 2 · Escalation Management - scaffolded, GlideFast-specific content authored later (not invented)
  html += `<section class="ref-sec">
    <h3 class="ref-h">Escalation Management</h3>
    <div class="ref-placeholder">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      <div><b>Not yet authored.</b><p>This section will hold GlideFast's escalation guidance - when and how to raise an issue, severity tiers, and who to contact at each level. Add the real content here when it's ready.</p></div>
    </div>
  </section>`;

  // 3 · Job Aids index - auto-derived from every task's jobAids across all methodologies
  const aids = [];
  data.methodologies.forEach(m => m.phases.forEach(p => p.subPhases.forEach(s => (s.tasks || []).forEach(t => (t.jobAids || []).forEach(j => { if (j.url) { aids.push({ m, p, s, t, j }); } })))));
  html += `<section class="ref-sec">
    <h3 class="ref-h">Job Aids index <span class="ref-count">${aids.length}</span></h3>
    <p class="ref-lead">Every job aid referenced by a task, across all methodologies, in one place. This list builds itself from the tasks - add a job aid to a task and it appears here.</p>`;
  if (!aids.length) {
    html += '<p class="empty">No job aids yet.</p>';
  } else {
    html += '<div class="ref-aids">';
    aids.forEach(a => {
      const scope = (a.j.roles && a.j.roles.length)
        ? sortJobTitleIds(a.j.roles).map(rid => { const r = jobTitleById(rid); return r ? `<span class="ja-scope" style="--c:${jobTitleColor(rid)}">${r.external ? '◇ ' : ''}${esc(r.abbr)}</span>` : ''; }).join('')
        : '<span class="ref-allroles">All roles</span>';
      html += `<div class="ref-aid">
        <a class="jobaid" href="${esc(a.j.url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>Job Aid</a>
        <div class="ref-aid-body">
          <div class="ref-aid-task">${withJargon(esc(a.t.text))}</div>
          <button class="ref-aid-crumb" data-jump="${a.s.id}" data-meth="${a.m.id}">${esc(a.m.name)} › ${esc(a.p.name)} › ${esc(a.s.sid)} ${esc(a.s.name)} ↗</button>
          <div class="ref-aid-scope"><span>Applies to:</span> ${scope}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  html += '</section></div>';

  main.innerHTML = html;
  main.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    if (b.dataset.meth !== state.methodologyId) { state.methodologyId = b.dataset.meth; }
    jumpTo(b.dataset.jump);
  });
}

/* ---------------- Search ---------------- */
function renderSearch() {
  const q = state.search.trim().toLowerCase();
  let html = '';
  if (q.length < 2) { html += '<p class="empty">Type at least two characters.</p>'; main.innerHTML = html; return; }

  const results = [];
  data.methodologies.forEach(m => m.phases.forEach(p => p.subPhases.forEach(s => {
    const hay = [s.name, s.overview, s.objective, ...(s.comments || []), ...(s.inputs || []), ...(s.deliverables || []), ...(s.tasks || []).map(t => t.text)].join('  ');
    if (hay.toLowerCase().includes(q)) {
      results.push({ m, p, s, snippet: makeSnippet(hay, q) });
    }
  })));

  if (!results.length) { html += '<p class="empty">No matches.</p>'; }
  results.forEach(r => {
    html += `<button class="search-result" data-jump="${r.s.id}" data-meth="${r.m.id}">
      <div class="sr-loc">${esc(r.m.name)} › ${esc(r.p.name)} › ${esc(r.s.sid)}</div>
      <div class="sr-title">${esc(r.s.name)}</div>
      <div class="sr-snip">${r.snippet}</div>
    </button>`;
  });
  main.innerHTML = html;
  main.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    if (b.dataset.meth !== state.methodologyId) { state.methodologyId = b.dataset.meth; }
    jumpTo(b.dataset.jump);
  });
}
function makeSnippet(hay, q) {
  const clean = hay.replace(/\n+/g, ' · ');
  const i = clean.toLowerCase().indexOf(q);
  if (i < 0) { return esc(clean.slice(0, 120)); }
  const start = Math.max(0, i - 40);
  const seg = clean.slice(start, i + q.length + 60);
  return (start > 0 ? '…' : '') + esc(seg.slice(0, i - start)) + '<mark>' + esc(seg.slice(i - start, i - start + q.length)) + '</mark>' + esc(seg.slice(i - start + q.length)) + '…';
}

function jumpTo(subId) {
  state.subPhaseId = subId;
  state.view = 'browse';
  const loc = findSubPhase(subId);
  state.justRead = loc ? markRead(loc.sp) : [];
  document.getElementById('searchInput').value = '';
  state.search = '';
  render();
  main.scrollIntoView({ block: 'start' });
}

/* ---------------- Jargon inline tooltips ---------------- */
function withJargon(escaped) {
  if (!state.showJargon) { return escaped; }
  const terms = Object.keys(data.appendix.jargon || {});
  if (!terms.length) { return escaped; }
  const re = new RegExp('\\b(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'g');
  return escaped.replace(re, (mtch) => {
    const def = data.appendix.jargon[mtch];
    return `<span class="jargon-term" data-tip-name="${esc(mtch)}" data-tip="${esc(def)}">${esc(mtch)}</span>`;
  });
}

/* ---------------- Tooltip engine ---------------- */
const tip = document.getElementById('tip');
function wireTooltips() {
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.onmouseenter = () => showTip(el);
    el.onmouseleave = hideTip;
    el.onmousemove = (e) => positionTip(e);
  });
}
function showTip(el) {
  const name = el.dataset.tipName || '';
  tip.innerHTML = (name ? `<span class="tname">${esc(name)}</span>` : '') + esc(el.dataset.tip);
  tip.classList.add('show');
}
function hideTip() { tip.classList.remove('show'); }
function positionTip(e) {
  const pad = 14;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) { x = e.clientX - r.width - pad; }
  if (y + r.height > window.innerHeight - 8) { y = e.clientY - r.height - pad; }
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

/* ---------------- Top bar actions ---------------- */
// view tabs (Journey / RACI / What's New)
document.querySelectorAll('.vtab').forEach(b => {
  b.onclick = () => {
    if (state.editMode) { toast('Finish editing first'); return; }
    if (state.view === b.dataset.view) { return; }
    state.view = b.dataset.view;
    if (state.search) { state.search = ''; document.getElementById('searchInput').value = ''; }
    render();
  };
});
document.getElementById('jargonToggle').onchange = (e) => {
  state.showJargon = e.target.checked;
  savePrefs();
  render();
};
const searchInput = document.getElementById('searchInput');
searchInput.oninput = () => {
  state.search = searchInput.value;
  if (state.search.trim().length >= 1) {
    if (state.editMode) { return; }
    state.view = 'search';
  } else if (state.view === 'search') {
    state.view = 'browse';
  }
  render();
};

/* ---------------- Utils ---------------- */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtDate(d) {
  const parts = String(d).split('-');
  if (parts.length !== 3) { return d; }
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${months[+parts[1] - 1]} ${+parts[2]}, ${parts[0]}`;
}
let toastTimer = null;
const toastEl = document.getElementById('toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

render();
</script>
