        <!-- Root wrapper exists (unlike before) solely to carry .view-blur while the Shell's search
           overlay is open - this widget has no tip-delegation handlers of its own. -->
        <div class="view-root" ng-class="{'view-blur': c.searchOpen()}">
          <p class="empty" ng-if="!c.whatsNew.length">Nothing unread. You&rsquo;re caught up.</p>
          <button type="button" class="whatsnew-item" ng-repeat="item in c.whatsNew track by item.entry.id" ng-click="c.jumpTo(item.subPhase.id, item.methodology.id)">
            <div class="wn-top">
              <span class="wn-loc" ng-style="{background: item.color}">{{item.methodology.name}} &middot; {{item.subPhase.sid}}</span>
              <span class="wn-title">{{item.subPhase.name}}</span>
              <span class="wn-date">{{c.formatDate(item.entry.ts)}} &middot; {{c.daysAgo(item.entry.ts)}}d ago</span>
            </div>
            <div class="wn-summary">{{item.entry.text}}</div>
          </button>
        </div>
