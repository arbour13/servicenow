  <script>
    // Blocking (deliberately not deferred/async) - runs before the stylesheet below paints anything,
    // so the app opens straight into the right theme instead of flashing dark mode first and then
    // switching. Mirrors ThemeService.init()'s own logic exactly (same localStorage key, same
    // prefers-color-scheme fallback); that code still runs the same logic on bootstrap (idempotent -
    // it just re-sets the same attribute), this is only here to beat first paint. See Glide Studio's
    // index.html for the same pattern.
    (function () {
      try {
        var t = localStorage.getItem('deliveryMethodologyTheme');
        if (!t) { t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { }
    })();
  </script>
  <!-- Dev-harness fonts only - matches the standalone prototype so the preview renders in Montserrat /
     IBM Plex Mono rather than a fallback. The deployed Service Portal widget inherits type from the
     portal theme (per ServiceNow/CLAUDE.md styling notes), so these CDN links do NOT ship.
     display=swap (not =optional): optional gives the font ~100ms to arrive, then commits to the
     fallback for the WHOLE page load if it misses that window - on a cold cache (hard refresh)
     it reliably misses, so the page rendered in a more condensed fallback font until the next
     load, while a warm cache hit the window and rendered in Montserrat - the same page looking
     measurably different depending on cache state. swap always ends up in Montserrat; the
     trade-off is a brief visible font swap on a cold load, which is preferable here since this is
     dev-preview only and the shipped SN widget doesn't use these fonts at all. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
