<div class="gfd-widget">
<div class="app" ng-cloak>

  <header class="topbar">
    <div class="topbar-brand"><span class="topbar-logo" aria-hidden="true">G</span>GlideFast Docs</div>
    <button type="button" class="topbar-theme-toggle" ng-click="vm.toggleTheme()"
            aria-pressed="{{vm.theme === 'dark'}}" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg ng-if="vm.theme === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg ng-if="vm.theme !== 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <div class="docs-pane">
    <div class="page-title page-title-sticky">
      <span aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
      <div>
        <div class="page-title-name">Docs</div>
        <div class="page-title-sub">GlideFast reference documentation</div>
      </div>
      <!-- Fallback copy of the rail's own search box (see .docs-rail below) - the rail hides below
           1260px, and with no in-page nav at that width search needs somewhere else to live so it
           never disappears entirely. Hidden via CSS (.docs-search-wrap-header, app.scss) whenever
           the rail's own copy is visible, so exactly one is ever shown; both bind vm.docsQuery so
           they can never drift out of sync. -->
      <div class="page-title-actions">
        <div class="docs-search-wrap docs-search-wrap-header">
          <input type="text" class="docs-search-input" ng-model="vm.docsQuery" ng-change="vm.updateDocsSearchResults()" placeholder="Search docs…" aria-label="Search docs">
          <button type="button" class="docs-search-clear" ng-if="vm.docsQuery" ng-click="vm.clearDocsSearch()" aria-label="Clear search" title="Clear search">✕</button>
        </div>
      </div>
    </div>

    <!-- The docs (see DocsService, generated from pages/**/*.md). Two columns on wide screens: a
         sticky rail on the left is the ONE nav (groups -> pages -> sections; see
         main.controller.js's IntersectionObserver setup for vm.activeSectionId, which keeps it
         synced to scroll position within whichever page is open), and the reading column stays
         capped at .docs-content's measure (940px) rather than stretching to fill the pane. The rail
         hides below 1260px; with no in-page nav at that width, the reader falls back to plain
         scrolling. -->
    <div class="docs-layout">

      <aside class="docs-rail" aria-label="On this page">
        <!-- Search lives here (not just the header) so it sits with the rail - but the rail itself
             hides below 1260px (see its own media query at the bottom of app.scss), so this copy
             would disappear at exactly the width where search is needed most. The header keeps its
             OWN copy (.docs-search-wrap-header, above) as a fallback, shown only when this one is
             hidden - both bind the same vm.docsQuery, so they can never drift out of sync. -->
        <div class="docs-search-wrap">
          <input type="text" class="docs-search-input" ng-model="vm.docsQuery" ng-change="vm.updateDocsSearchResults()" placeholder="Search docs…" aria-label="Search docs">
          <button type="button" class="docs-search-clear" ng-if="vm.docsQuery" ng-click="vm.clearDocsSearch()" aria-label="Clear search" title="Clear search">✕</button>
        </div>
        <button type="button" class="docs-rail-home" ng-class="{active: vm.docsView === 'home'}" ng-click="vm.showDocsHome()">Home</button>
        <!-- Groups are structural labels, not navigable pages of their own - unlike the rail's page
             and section rows below, a group heading has no ng-click. Pages, each expandable to
             their own sections - the rail stays to "which pages exist" at rest, with sections a
             click away rather than always-on clutter. Expand/collapse (vm.docsPageExpanded) is
             driven ONLY by the chevron button below (vm.toggleDocsExpand) - clicking the page's own
             name just navigates, same as always, and never touches expand state either way.
             vm.docsPageHeadingActive lights the page's name up only when the reader is at its own
             top, not a nested section (that gets its own highlight below, regardless of the page's
             expand state). -->
        <div class="docs-rail-band" ng-repeat="grp in vm.docsGroups" ng-show="vm.docsGroupVisible(grp)">
          <div class="docs-rail-band-title">{{grp.name}}</div>
          <div class="docs-rail-chapter" ng-repeat="page in grp.pages" ng-show="vm.docsPageVisible(page)">
            <div class="docs-rail-part-row">
              <button type="button" class="docs-rail-part"
                      ng-class="{active: vm.docsPageHeadingActive(page)}"
                      ng-click="vm.openPage(page.id)">{{page.title}}</button>
              <button type="button" class="docs-rail-expand" ng-class="{expanded: vm.docsPageExpanded(page)}"
                      ng-click="vm.toggleDocsExpand(page, $event)"
                      aria-label="{{vm.docsPageExpanded(page) ? 'Collapse' : 'Expand'}} {{page.title}} sections"
                      aria-expanded="{{vm.docsPageExpanded(page)}}">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2l4 3-4 3"/></svg>
              </button>
            </div>
            <div class="docs-rail-sections" ng-if="vm.docsPageExpanded(page)">
              <button type="button" class="docs-rail-section" ng-repeat="section in page.sections" ng-show="vm.docsSectionMatches(section)"
                      ng-class="{active: vm.activeSectionId === section.id}"
                      ng-click="vm.openPage(page.id, section.id)">{{section.title}}</button>
            </div>
          </div>
        </div>
      </aside>

      <div class="docs-layout-main">

        <!-- Search results - replaces whatever the content area would otherwise show (Home or an
             open page) whenever a query is active, since only the CURRENTLY OPEN page's HTML is
             ever mounted (see DocsUiService's own header comment) - there's no already-rendered
             content to just reveal via ng-show the way this app's old single-document design did. -->
        <div class="card" ng-if="vm.docsQuery">
          <div class="card-head"><h2>Search results</h2></div>
          <div class="card-body">
            <p class="empty" ng-if="!vm.docsHasMatches()">No matching pages for "{{vm.docsQuery}}".</p>
            <p class="hint" ng-if="vm.docsHasMatches()">Showing pages matching "{{vm.docsQuery}}". <button type="button" class="docs-link" ng-click="vm.clearDocsSearch()">Clear search</button></p>
            <div class="docs-results-list" ng-if="vm.docsHasMatches()">
              <div class="docs-results-page" ng-repeat="result in vm.docsSearchResults">
                <button type="button" class="docs-results-page-title" ng-click="vm.openPage(result.page.id)">
                  <span class="docs-results-breadcrumb">{{result.group.name}}</span>
                  <span>{{result.page.title}}</span>
                </button>
                <button type="button" class="docs-results-section" ng-repeat="section in result.sections" ng-click="vm.openPage(result.page.id, section.id)">{{section.title}}</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Home: lead text + every page as a clickable tile, grouped. Ghost "Planned" tiles
             (grp.planned - see pages/planned.json) show pages that don't exist yet, so a thin
             group reads as a visible roadmap instead of just sparse. Tile accent/icon alternates by
             the group's own position ($parent.$index, from the outer ng-repeat) rather than
             matching a specific group name, so this scales to any number of groups. -->
        <div class="card" ng-if="!vm.docsQuery && vm.docsView === 'home'">
          <div class="card-head"><h2>Contents</h2></div>
          <div class="card-body">
            <div class="docs-content" ng-bind-html="vm.homeLead"></div>
            <div class="docs-hub">
              <div class="docs-hub-band" ng-repeat="grp in vm.docsGroups">
                <h3 class="docs-hub-band-title">{{grp.name}}</h3>
                <div class="docs-hub-grid">
                  <button type="button" class="docs-hub-tile" ng-class="{'docs-hub-tile-alt': $parent.$index % 2 === 1}" ng-repeat="page in grp.pages" ng-click="vm.openPage(page.id)">
                    <span class="ic">
                      <svg ng-if="$parent.$index % 2 === 0" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M6 9.2l2 2 4-4.4"/></svg>
                      <svg ng-if="$parent.$index % 2 !== 0" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L2 6.5l7 4.5 7-4.5L9 2z"/><path d="M2.5 9.5L9 13.5l6.5-4"/></svg>
                    </span>
                    <span class="t">{{page.title}}</span>
                    <span class="meta">{{page.sections.length}} section<span ng-if="page.sections.length !== 1">s</span></span>
                  </button>
                  <div class="docs-hub-tile ghost" ng-class="{'docs-hub-tile-alt': $parent.$index % 2 === 1}" ng-repeat="p in grp.planned">
                    <span class="ic">
                      <svg ng-if="$parent.$index % 2 === 0" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="7"/><path d="M6 9.2l2 2 4-4.4"/></svg>
                      <svg ng-if="$parent.$index % 2 !== 0" width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L2 6.5l7 4.5 7-4.5L9 2z"/><path d="M2.5 9.5L9 13.5l6.5-4"/></svg>
                    </span>
                    <span class="t">{{p}}</span>
                    <span class="badge">Planned</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- An open page: its own lead + sections only - not every page, unlike this app's old
             single-document design where the whole doc rendered at once and visibility alone
             decided what showed. -->
        <div class="card" ng-if="!vm.docsQuery && vm.docsView === 'page'">
          <div class="card-head">
            <h2><span class="docs-breadcrumb">{{vm.activeGroup.name}}</span><span class="docs-breadcrumb-sep" aria-hidden="true">/</span>{{vm.activePage.title}}</h2>
          </div>
          <div class="card-body docs-content">
            <div ng-bind-html="vm.activePage.lead"></div>
            <div ng-repeat="section in vm.activePage.sections" ng-bind-html="section.html"></div>
          </div>
        </div>

      </div>

    </div>
  </div>

</div>
</div>
