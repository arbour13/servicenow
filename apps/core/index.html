<!DOCTYPE html>
<html lang="en" ng-app="core">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23054b80'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- The `.app` div is what the packager extracts as the widget template (see
     scripts/build-deploy.js / snpackager.core.js buildTemplateFromSource). Keep the widget's real
     markup inside it. -->
<div class="app" ng-cloak ng-controller="MainController as vm">
  <header class="core-head">
    <span class="core-badge">Core</span>
    <span class="core-head-title">Shared foundation for the ServiceNow app suite</span>
  </header>
  <core-doc doc="vm.doc"></core-doc>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="js/app.module.js"></script>
<!-- Core's shared providers (consumer apps load these same files directly from /apps/core/js/...). -->
<script src="js/services/theme.service.js"></script>
<script src="js/services/confirm-modal.service.js"></script>
<script src="js/services/doc-viewer.service.js"></script>
<script src="js/directives/core-modal.directive.js"></script>
<script src="js/directives/core-sync-attr.directive.js"></script>
<script src="js/directives/core-doc.directive.js"></script>
<!-- Core's own doc content (Core-specific, not shared machinery). -->
<script src="js/services/core-docs.data.js"></script>
<script src="js/controllers/main.controller.js"></script>
</body>
</html>
