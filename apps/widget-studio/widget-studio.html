  // (vs/loader.min.js defines window.define/require — any plain UMD script here registers as an AMD
  // module instead of setting a global, so window.FloatingUIDOM would silently come back empty).
  import {computePosition, offset, flip, shift} from 'https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.13/+esm';

<style>
  html, body { margin:0; padding:0; }
  * { box-sizing: border-box; }
  @keyframes dropPulse { 0%,100%{opacity:.5} 50%{opacity:.9} }
  @keyframes wsIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  @keyframes wsFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes wsLayoutReveal { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
  @keyframes wsFlash { 0%,55%{background:#fff6da} 100%{background:transparent} }
  @keyframes wsChipGrow { from{max-width:0;opacity:0} to{max-width:110px;opacity:1} }
  @keyframes wsClassChange { 0%{background:rgba(88,166,255,.45)} 100%{background:rgba(88,166,255,0)} }
  @keyframes wsFadeIn { from{opacity:0} to{opacity:1} }
  /* Spacing-diagram side-band hover/active fills are computed inline in spacingDiagram (per-face, relative
     to each face's own resting tone) rather than via CSS classes — see the comments there. */
  /* Animate state changes across the editor chrome. background-color is excluded so
     selection highlights (segmented controls, tiles) snap instantly instead of fading. */
  .ws-chrome, .ws-chrome * {
    transition: border-color .18s ease, color .15s ease,
                box-shadow .2s ease, fill .15s ease, opacity .18s ease, outline-color .18s ease;
  }
  /* Brief window (toggled by toggleDark) that adds background-color back to the transition list, so a
     light↔dark flip fades instead of snapping — everyday background snaps (tile picks, hovers) are
     unaffected since this class is only present for ~260ms right after the theme switches. */
  .ws-chrome.ws-theme-fade, .ws-chrome.ws-theme-fade * {
    transition: background-color .22s ease, border-color .18s ease, color .18s ease,
                box-shadow .2s ease, fill .18s ease, stroke .18s ease, opacity .18s ease, outline-color .18s ease;
  }
  /* Live preview: no paint-fade (snappy drags). FLIP transforms use inline transition, which wins.
     !important so this always wins over .ws-theme-fade's higher-specificity rule above too. */
  .ws-stage, .ws-stage * { transition: none !important; }
  /* Keyboard focus: a clear ring on any focusable control (mouse clicks don't trigger :focus-visible). */
  [role="button"]:focus-visible, [role="tab"]:focus-visible, [role="switch"]:focus-visible,
  [role="radio"]:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid #2563eb; outline-offset: 2px; border-radius: 4px;
  }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#b8c0c9; border-radius:5px; border:2px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:#9aa3ad; background-clip:content-box; }
  .monaco-host { height:100%; width:100%; }
  /* Code-drawer tab pill: stays one row and pans horizontally when the canvas is narrow — a
     visible scrollbar would collide with the fixed 40px bar height. */
  .ws-tabscroll::-webkit-scrollbar { display:none; }
</style>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.uidc = 1; this.clsc = {};
    this.CANVAS_GAP = '0';  // no synthetic spacing between siblings — elements render flush (real gap/margin only)
    this.REPEAT_PREVIEW_N = 6;  // fixed ghost-copy count for a repeating element with no real sample array to size from — no longer user-editable ("Preview copies" field removed, it just confused people)
    this._inspOpen = {};  // big-card (Structure/Appearance) open/closed state; inspector sections are tabs now
    this.dark = false; this.device = 'lg';
    this.codeTheme = 'auto';  // Monaco theme: 'auto' follows the app theme, or pin 'light'/'dark' independently
    this.exportUnit = 'px'; this.exportBase = 16;
    this.tab = 'layout';            // inspector tab
    this.codeTab = 'html';          // drawer tab
    this.drawerOpen = true; this.previewH = 300;
    this.splitView = true; this.splitW = 400;  // code+preview side-by-side; width of the preview pane
    this.cssVarBridge = false;  // SCSS export: also bridge $vars to :root { --x: #{$x} } (off by default)
    this.loadUiPrefs();  // restore drawer height / split settings (UI prefs only — not widget content)
    this.previewFw = 'bs3';
    this.FW = {
      bs3:{name:'Bootstrap 3 · ServiceNow', css:['https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css']},
      bs5:{name:'Bootstrap 5', css:['https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css']},
      tailwind:{name:'Tailwind', css:[], js:['https://cdn.tailwindcss.com']},
      none:{name:'No framework', css:[]}
    };
    this.exportOpen = false; this.exTab = 0;
    this.wid = 'untitled'; this.wname = 'Untitled';
    this.selectedId = 'root'; this.multiSel = [];  // multiSel: extra ids in a shift-click group selection (all siblings of selectedId); [] = single-select
    this.ctxMenu = null;    // right-click context menu: {nodeId,x,y} | null
    this.clipboard = null;  // copy/paste: array of deep-cloned nodes (re-idded fresh at paste time)
    this.leftTab = 'layers'; this.panelMode = 'split'; this.addPopover = null; this.leftW = 292; this.rightW = 340;
    this.paletteSplit = 0.55;      // palette's share of the Build tab height (Layers gets the rest); drag the seam to change
    this.paletteCollapsed = null;  // {cat:bool} — null = defaults (Layout/Text open, the rest collapsed)
    this.drag = null; this.dropContainer = null; this.dropIndex = null; this.dropSlot = null; this.dropCol = null; this.dropZone = null; this.dropWrap = null; this.dropAxis = null; this.dropFlexAxis = null; this.ghostXY = {x:0,y:0};
    this.classStyles = {};
    this.stateStyles = {};   // { [cls]: { hover:{…}, focus:{…}, active:{…}, disabled:{…}, checked:{…} } } — pseudo-state rules
    this.responsive = {md:{}, sm:{}, xs:{}};  // per-breakpoint base-layer overrides: { [bp]: { [cls]: {prop:val} } }
    this.tokens = this.parseVars(this.DEFAULT_VARS());  // starter widget variables; edit DEFAULT_VARS() to change them
    // Bootstrap 3 grid tiers (desktop-first, max-width). lg = base layer (≥ 1200px, no media query);
    // md/sm/xs are max-width overrides that cascade down at narrower widths, matching ServiceNow portals.
    this.BREAKPOINTS = {md:{max:1199,label:'md'}, sm:{max:991,label:'sm'}, xs:{max:767,label:'xs'}};
    this._estate = 'base';   // which state the inspector is currently editing
    this.showBox = false;    // box-model overlay toggle
    this._previewMode = false;     // header eye toggle: replace the whole canvas with the live interactive preview
    this._crumbOpen = null;        // id of the selected node whose walk-up ancestor label stack is expanded
    this.focusStack = [];    // focus-mode: ids of the composable(s) being scoped-edited (last = active); [] = off
    this.code = {
      client: "api.controller = function () {\n  var c = this;\n\n  \n};",
      server: "(function () {\n  \n})();",
      link:   "function link(scope, element, attrs, controller) {\n  \n}"
    };
    this.optionSchema = [];   // Service Portal widget option schema (in-memory, like this.code)
    this.instanceClass = 'base';  // sp_instance subclass → which inherited fields the instance provides
    this.instanceFields = [];     // which inherited field NAMES the author chose to surface (opt-in)
    this._draftAt = null;             // when the draft was last persisted (header "Draft saved" label)
    this._draftRestoredNotice = null; // {at} while a just-restored UNSAVED draft's banner is showing
    this._previewValues = {};     // preview-only option/instance-field values (never exported)
    this._dataVariants = {};      // preview-only c.data.* array size overrides, keyed by array name — same
                                   // "never exported, never touches real code" contract as _previewValues,
                                   // so switching Empty/Few/Many is instant and fully reversible
    this._optExpanded = null; this._optJson = false; this._optCommonOpen = false; this._optSeq = 0;
    this.LABELC = {default:'#777',primary:'#337ab7',success:'#5cb85c',info:'#5bc0de',warning:'#f0ad4e',danger:'#d9534f'};
    this.CONTAINER_TAGS = ['div','section','header','footer','main','nav','article','aside','form','figure','blockquote','ul','ol','li'];
    this.TEXT_TAGS = ['span','p','a','button','label','h1','h2','h3','h4','h5','h6'];
    // BEM element role per tag/type. The element class is `{block}__{role}`; same-role elements
    // share one class (no numbering). Renameable in the inspector.
    this.ROLE_MAP = {div:'container',section:'section',header:'header',footer:'footer',main:'main',nav:'nav',article:'article',aside:'aside',form:'form',figure:'figure',blockquote:'quote',ul:'list',ol:'list',li:'item',h1:'title',h2:'heading',h3:'heading',h4:'heading',h5:'heading',h6:'heading',p:'text',span:'text',a:'link',button:'btn',label:'label',img:'image',video:'video',iframe:'embed',input:'field',select:'field',textarea:'field',table:'table'};
    // Properties allowed to live inline (content/runtime-driven, can't sensibly be a shared rule).
    this.INLINE_PROPS = {backgroundImage:1};
    this.PALETTE = [
      {cat:'Layout', items:[
        {type:'el',tag:'div',label:'div'},{type:'el',tag:'section',label:'section'},
        {type:'el',tag:'header',label:'header'},{type:'el',tag:'footer',label:'footer'},
        {type:'el',tag:'nav',label:'nav'},{type:'el',tag:'article',label:'article'},
        {type:'el',tag:'aside',label:'aside'},{type:'el',tag:'ul',label:'list'},
        {type:'el',tag:'li',label:'list item'},
        {type:'el',tag:'form',label:'form'},{type:'el',tag:'hr',label:'hr'}
      ]},
      {cat:'Text', items:[
        {type:'el',tag:'h2',label:'heading'},{type:'el',tag:'p',label:'text'},
        {type:'el',tag:'span',label:'span'},{type:'el',tag:'a',label:'link'},
        {type:'el',tag:'label',label:'label'}
      ]},
      {cat:'Media', items:[
        {type:'el',tag:'img',label:'img'},{type:'icon',label:'icon'},
        {type:'el',tag:'figure',label:'figure'},{type:'el',tag:'video',label:'video'},{type:'el',tag:'iframe',label:'iframe'}
      ]},
      {cat:'Forms', items:[
        {type:'el',tag:'button',label:'button'},{type:'el',tag:'input',label:'input'},
        {type:'el',tag:'select',label:'select'},{type:'el',tag:'textarea',label:'textarea'}
      ]},
      // "Bootstrap": these chips emit Bootstrap 3 markup/classes (panel panel-default, alert, …) that
      // any Service Portal theme already styles — distinct from the plain semantic elements above.
      {cat:'Bootstrap', items:[
        {type:'formgroup',label:'form group'},
        {type:'panel',label:'panel'},
        {type:'alert',label:'alert'},
        {type:'badge',label:'badge'},
        {type:'table',label:'table'},
        {type:'navtabs',label:'nav tabs'},
        {type:'listgroup',label:'list group'},
        {type:'progress',label:'progress'},
        {type:'breadcrumb',label:'breadcrumb'},
        {type:'buttongroup',label:'button group'}
      ]},
      {cat:'Custom', items:[
        {type:'card',label:'card'}
      ]},
      {cat:'Advanced', items:[
        {type:'html',label:'html'}
      ]}
    ];
    // Per-type config for a component's "configurable" flow (composition into a real container of real
    // sub-elements, with focus mode for scoped editing) — the single source of truth for that flow. Adding a
    // type here opts it in; nothing is special-cased on 'card'. Direction: every component in the palette
    // above is meant to grow some flavor of configurability over time, not just 'card' — hence this being a
    // registry keyed by type, not a bolted-on special case, and 'card' living in the ordinary Components
    // palette group rather than a separate "Configurable components" category.
    this.COMPOSABLES = {
      card: {
        label:'card',
        bodyLayout:{display:'flex',flexDirection:'column',gap:'8px'},
        // Sub-elements offered in build-your-own + the focus-mode palette. Labels match the app's real element
        // vocabulary (same names as the main palette — img, heading, text, span, link, label, icon, div, hr) instead
        // of abstract card-only terms (the old "image"/"title"/"tag"/"group" labels hid what
        // tag/component was actually being added). `role` (when present) still builds the correct Bootstrap
        // card-* class via child() (e.g. "heading" → an h5.card-title, "img" → img.card-img-top) — the ROLE
        // controls the semantic markup, the LABEL just needs to say what real thing you're adding. `badge` is
        // a real component (type:'badge'), not a role-styled element, same as `button`.
        validChildren:[
          {type:'el',tag:'img',label:'img',role:'image'},
          {type:'el',tag:'h5',label:'heading',role:'title'},
          {type:'el',tag:'p',label:'text',role:'text'},
          {type:'el',tag:'span',label:'span'},
          {type:'el',tag:'label',label:'label'},
          {type:'icon',label:'icon'},
          {type:'el',tag:'a',label:'link',role:'link'},
          {type:'button',label:'button',role:'button'},
          {type:'badge',label:'badge'},
          {type:'el',tag:'hr',label:'hr'},
          {type:'el',tag:'div',label:'div'}
        ],
        // Role → node builder (arrow captures the instance). Used by the focus/quick-add drop paths.
        child:(role)=>this.makeCardChild(role)
      }
    };
    this.load();
  }
  // ---------- persistence ----------
  save(){ this.code.html=null; this.htmlError=null; this._dirty=true; this.pushHistory(); this.rawSave(); }
  // Draft auto-persist: every mutation choke point already funnels through rawSave(), which mirrors
  // the working widget to localStorage — a refresh or crash restores exactly where you were,
  // including which library record was open and whether it had unsaved changes. Save (⌘S) into the
  // library remains the explicit durable copy; the draft is just the in-progress buffer. Writes are
  // debounced (serializing a big tree on every keystroke is wasteful); the unload listener flushes
  // the pending write so the last edits aren't lost. Undo/redo history stays in-memory.
  DRAFT_KEY(){ return 'widgetStudio_draft'; }
  rawSave(){ clearTimeout(this._draftT); this._draftT=setTimeout(()=>this.writeDraft(),400); }
  writeDraft(){ try{ const at=Date.now(); localStorage.setItem(this.DRAFT_KEY(), JSON.stringify({data:this.serializeWidget(),savedId:this._savedId||null,dirty:!!this._dirty,at})); this._draftAt=at; }catch(e){} }
  readDraft(){ try{ const d=JSON.parse(localStorage.getItem(this.DRAFT_KEY())||'null'); return (d&&d.data)?d:null; }catch(e){ return null; } }
  // UI preferences (drawer height, split layout) ARE persisted — they're editor chrome, not widget
  // content, so they should survive a refresh.
  loadUiPrefs(){ try{ const p=JSON.parse(localStorage.getItem('widgetStudio_ui')||'{}');
    if(typeof p.previewH==='number') { this.previewH=Math.max(140,Math.min(660,p.previewH)); }
    if(typeof p.splitW==='number') { this.splitW=Math.max(220,Math.min(900,p.splitW)); }
    if(typeof p.splitView==='boolean') { this.splitView=p.splitView; }
    if(typeof p.drawerOpen==='boolean') { this.drawerOpen=p.drawerOpen; }
    if(typeof p.cssVarBridge==='boolean') { this.cssVarBridge=p.cssVarBridge; }
    if(typeof p.leftW==='number') { this.leftW=Math.max(292,Math.min(480,p.leftW)); }
    if(typeof p.rightW==='number') { this.rightW=Math.max(340,Math.min(540,p.rightW)); }
    if(typeof p.dark==='boolean') { this.dark=p.dark; }
    if(['auto','light','dark'].includes(p.codeTheme)) { this.codeTheme=p.codeTheme; }
    if(typeof p.paletteSplit==='number') { this.paletteSplit=Math.max(0.15,Math.min(0.85,p.paletteSplit)); }
    if(p.paletteCats&&typeof p.paletteCats==='object') { this.paletteCollapsed=p.paletteCats; }
  }catch(e){} }
  saveUiPrefs(){ try{ localStorage.setItem('widgetStudio_ui', JSON.stringify({previewH:this.previewH,splitW:this.splitW,splitView:this.splitView,drawerOpen:this.drawerOpen,cssVarBridge:this.cssVarBridge,leftW:this.leftW,rightW:this.rightW,dark:this.dark,codeTheme:this.codeTheme,paletteSplit:this.paletteSplit,paletteCats:this.paletteCollapsed})); }catch(e){} }
  // Background-color is excluded from the chrome's normal transition list (so selection highlights snap
  // instantly — see the .ws-chrome rule) — briefly add it back just for the theme flip so light↔dark fades
  // instead of snapping, then drop it again so ordinary interactions stay snappy.
  toggleDark(){ this.dark=!this.dark; this.saveUiPrefs(); this._themeFade=true; this.forceUpdate();
    clearTimeout(this._themeFadeT); this._themeFadeT=setTimeout(()=>{ this._themeFade=false; this.forceUpdate(); },260); }
  // Code editor theme is independent of the app theme by default it just follows it ('auto'), but a user
  // reading code in a light app (or dark) can pin the editor the other way; cycles auto → light → dark → auto.
  effectiveCodeTheme(){ return this.codeTheme==='auto' ? (this.dark?'dark':'light') : this.codeTheme; }
  cycleCodeTheme(){ const order=['auto','light','dark']; this.codeTheme=order[(order.indexOf(this.codeTheme)+1)%order.length]; this.saveUiPrefs(); this.forceUpdate(); }
  snapshot(){ return JSON.stringify({tree:this.tree,classStyles:this.classStyles,stateStyles:this.stateStyles,responsive:this.responsive,tokens:this.tokens,sel:this.selectedId}); }
  pushHistory(){ const snap=this.snapshot(); const now=Date.now(); if(!this.history){ this.history=[snap]; this.histIdx=0; this._lastPush=now; return; } if(snap===this.history[this.histIdx]) { return; } if(now-this._lastPush<600){ this.history[this.histIdx]=snap; } else { this.history=this.history.slice(0,this.histIdx+1); this.history.push(snap); if(this.history.length>120) { this.history.shift(); } this.histIdx=this.history.length-1; } this._lastPush=now; }
  undo(){ if(this.history&&this.histIdx>0){ this.histIdx--; this.restoreHist(this.history[this.histIdx]); } }
  redo(){ if(this.history&&this.histIdx<this.history.length-1){ this.histIdx++; this.restoreHist(this.history[this.histIdx]); } }
  restoreHist(snap){ const o=JSON.parse(snap); this.tree=o.tree; this.classStyles=o.classStyles||{}; this.stateStyles=o.stateStyles||{}; this.responsive=o.responsive||{md:{},sm:{},xs:{}}; if(o.tokens) { this.tokens=o.tokens; } this.multiSel=[]; this.selectedId=o.sel||'root'; this._editing=null; this._lastPush=0; this.rawSave(); this.forceUpdate(); }
  load(){
    // Restore the auto-persisted draft if one exists (loadWidgetData resets _dirty/_savedId, so
    // re-apply the draft's after it); otherwise start from a clean default widget.
    const draft=this.readDraft();
    if(draft){ this.loadWidgetData(draft.data); this._savedId=draft.savedId||null; this._dirty=!!draft.dirty; this._draftAt=draft.at||null;
      // Only surface the restore banner for genuinely unsaved work with real content — a clean
      // reload (already saved) or an empty draft has nothing surprising to explain.
      const hasContent=draft.data&&draft.data.tree&&draft.data.tree.children&&draft.data.tree.children.length>0;
      if(draft.dirty && hasContent) { this._draftRestoredNotice={at:draft.at||Date.now()}; }
      return; }
    this.tree={id:'root',type:'root',classes:[],data:{tag:'div'},children:[]};
    this.focusStack=[];
    this.history=[this.snapshot()]; this.histIdx=0; this._lastPush=0;
  }
  // ---------- local widget library ----------
  // All access to saved widgets funnels through this thin store so that moving to a ServiceNow table later
  // means swapping ONLY these three methods (listWidgets/writeWidgets keys, and the shape stays the same).
  STORE_KEY(){ return 'widgetStudio_widgets'; }
  // A blob that won't parse is preserved under a datestamped backup key BEFORE the next save can
  // overwrite it — showing an empty library is graceful, silently discarding recoverable data is not.
  // `_storeCorrupt` surfaces a notice (with the backup key) in the library modal.
  listWidgets(){ const raw=localStorage.getItem(this.STORE_KEY()); if(raw==null) { return []; }
    try{ const a=JSON.parse(raw); if(Array.isArray(a)) { return a; } }catch(e){}
    this.backupCorruptStore(raw); return []; }
  backupCorruptStore(raw){ try{ const k=this.STORE_KEY()+'_corrupt_'+new Date().toISOString().slice(0,10); if(localStorage.getItem(k)==null) { localStorage.setItem(k,raw); } this._storeCorrupt=k; }catch(e){} }
  writeWidgets(arr){ try{ localStorage.setItem(this.STORE_KEY(), JSON.stringify(arr)); return true; }catch(e){ return false; } }
  // Everything needed to reconstruct a widget: identity, tree, all styling layers, tokens, the Options
  // schema, and the user-authored Client/Server/Link buffers (uidc so re-opening never reuses an id).
  DEFAULT_CODE(){ return {client:"api.controller = function () {\n  var c = this;\n\n  \n};",server:"(function () {\n  \n})();",link:"function link(scope, element, attrs, controller) {\n  \n}"}; }
  serializeWidget(){ return {wname:this.wname,wid:this.wid,tree:this.tree,classStyles:this.classStyles,stateStyles:this.stateStyles,responsive:this.responsive,tokens:this.tokens,optionSchema:this.optionSchema,code:{client:this.code.client,server:this.code.server,link:this.code.link},uidc:this.uidc,instanceClass:this.instanceClass,instanceFields:this.instanceFields}; }
  maxUid(){ let mx=0; const walk=n=>{ if(n&&typeof n.id==='string'){ const m=n.id.match(/_(\d+)$/); if(m) { mx=Math.max(mx,+m[1]); } } (n&&n.children||[]).forEach(walk); }; walk(this.tree); return mx; }
  loadWidgetData(d){ d=d||{};
    this.wname=d.wname||'Untitled'; this.wid=d.wid||'untitled';
    this.tree=d.tree||{id:'root',type:'root',classes:[],data:{tag:'div'},children:[]};
    this.classStyles=d.classStyles||{}; this.stateStyles=d.stateStyles||{};
    this.responsive=d.responsive||{md:{},sm:{},xs:{}};
    this.tokens=d.tokens||this.parseVars(this.DEFAULT_VARS());
    this.optionSchema=d.optionSchema||[];
    this.code=Object.assign(this.DEFAULT_CODE(), d.code||{});
    this.uidc=d.uidc||(this.maxUid()+1);
    this.instanceClass=d.instanceClass||'base'; this.instanceFields=d.instanceFields||[];
    this.focusStack=[]; this.multiSel=[]; this.selectedId='root'; this._editing=null; this.device='lg'; this._estate='base';
    this._tokCss=null; this._dirty=false; this.exportOpen=false;
